<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Tests Atlas: orthopedic maneuvers on a working skeleton</title>
<style>
:root{
  --bg:#e6ebef; --panel:#f5f7f9; --panel-2:#edf1f4; --ink:#1b2430; --ink-2:#4b5866; --ink-3:#6f7c89;
  --line:#c7d0d8; --stage-a:#e3e9ee; --stage-b:#b7c4cf;
  --bone:#b9a57c; --muscle:#b0413e; --ligament:#4f7fab; --nerve:#b88a12; --force:#cf7422; --torque:#6a46c2; --glove:#3f78de;
  --accent:#6a46c2; --accent-ink:#ffffff; --ok:#2c7a4b; --part:#a1660f; --bad:#b3343a; --floor:#cdd6dd;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Hoefler Text",Georgia,serif;
  --sans:"Avenir Next","Avenir","Segoe UI Variable Text","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1620; --panel:#12202b; --panel-2:#172734; --ink:#e2e8ee; --ink-2:#a3b2bf; --ink-3:#7d8e9c;
    --line:#26394a; --stage-a:#1b2b39; --stage-b:#070f16;
    --bone:#e3d3ae; --ligament:#8ab6dd; --nerve:#e6bf52; --force:#f2a24e; --torque:#a98fff; --glove:#7aa8ff;
    --accent:#a98fff; --accent-ink:#140d2a; --ok:#62c28d; --part:#e5b25e; --bad:#f07079; --floor:#172533;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#app{display:grid;grid-template-columns:248px minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr);height:100vh;min-height:560px}
header#top{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.005em;margin:0;line-height:1.1}
.brand p{margin:1px 0 0;color:var(--ink-3);font-size:12.5px}
.modes{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:transparent;padding:6px 18px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.layer i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35;flex:none}
.layer[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:color-mix(in srgb,var(--ink-3) 55%,var(--line))}
.layer[aria-pressed="true"] i{opacity:1}
#list{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 10px 18px}
.list-note{margin:0 8px 10px;color:var(--ink-3);font-size:12.5px}
#mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#mlist button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:4px 8px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer}
#mlist button:hover{background:var(--panel-2)}
#mlist button[aria-current="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
#mlist .rk{font-family:var(--serif);font-size:17px;color:var(--ink-3);text-align:right;font-variant-numeric:lining-nums}
#mlist .nm{font-weight:600;color:var(--ink)}
#mlist .jt{grid-column:2;font-size:12px;color:var(--ink-3)}
#mlist .freq{grid-column:2;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:2px}
#mlist .freq b{display:block;height:100%;background:var(--ink-3);opacity:.6}
#list.quiz-locked #mlist{opacity:.35;pointer-events:none;filter:blur(1.5px)}
#list .lock-note{display:none;margin:8px;color:var(--ink-2);font-size:13px}
#list.quiz-locked .lock-note{display:block}
#stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-9999px,-9999px);white-space:nowrap;font-size:12px;font-weight:600;padding:2px 7px 2px 6px;border-radius:6px;background:color-mix(in srgb,var(--panel) 86%,transparent);color:var(--ink);border-left:3px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:opacity .2s}
.lbl::before{content:"";position:absolute;left:-7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--c)}
#caption{position:absolute;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#caption .box{max-width:560px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:12px;padding:9px 13px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
#cap-title{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2}
#cap-text{color:var(--ink-2);margin-top:2px;font-size:13.5px}
#cap-text b{color:var(--ink);font-weight:600}
#hud{position:absolute;left:14px;bottom:64px;width:330px;height:188px;pointer-events:none}
#hud .bg{fill:var(--panel);fill-opacity:.9;stroke:var(--line)}
#hud text{font-family:var(--sans);fill:var(--ink-2);font-size:11.5px;font-variant-numeric:tabular-nums}
#hud .val{fill:var(--ink);font-weight:600}
#hud .ttl{fill:var(--ink);font-weight:600;font-size:12.5px}
#hud .axis{stroke:var(--line)}
#controls{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
#controls button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
#play{width:38px;display:grid;place-items:center}
#play svg{width:14px;height:14px;fill:var(--ink)}
.track{position:relative;flex:1;height:28px;display:flex;align-items:center}
#scrub{width:100%;margin:0;accent-color:var(--accent);cursor:pointer}
#ticks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
#ticks span{position:absolute;top:2px;width:2px;height:6px;background:var(--ink-3);opacity:.55;border-radius:1px}
#tclock{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px;min-width:66px;text-align:right}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(12px,12px);white-space:nowrap;z-index:5}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:15px;background:radial-gradient(120% 90% at 50% 30%,var(--stage-a),var(--stage-b));z-index:9}
#loading.err{color:var(--bad);padding:30px;text-align:center}
#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto}
.pad{padding:18px 20px 26px}
#detail h2{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.12;margin:0 0 6px;letter-spacing:.003em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.joint{color:var(--ink);font-weight:600}
#detail h3{font-size:13px;font-weight:700;margin:18px 0 6px;color:var(--ink)}
#detail p{margin:0 0 8px;color:var(--ink-2);max-width:62ch}
#detail p.lead{color:var(--ink);font-size:15px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:6px 8px 6px 34px;border-radius:8px;color:var(--ink-2);margin-bottom:2px;transition:background .25s,color .25s}
ol.steps li::before{content:counter(s);position:absolute;left:8px;top:6px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3)}
ol.steps li.on{background:var(--panel-2);color:var(--ink)}
ol.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;width:100%;text-align:left}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--bad)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.toggle b{display:block;color:var(--ink);font-weight:600}
.toggle small{color:var(--ink-3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:default;color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.sec{color:var(--ink-3);border-style:dashed}
.chip:hover{background:var(--panel-2)}
.grp{font-size:12px;color:var(--ink-3);margin:8px 0 4px}
.note{font-size:12px;color:var(--ink-3)}
.pearl{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin:6px 0 0;color:var(--ink-2)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.qprog{font-size:12.5px;color:var(--ink-3)}
.qscore{font-family:var(--serif);font-size:22px;font-weight:600}
.dots{display:flex;gap:4px;margin:0 0 16px;flex-wrap:wrap}
.dots span{width:18px;height:6px;border-radius:3px;background:var(--line)}
.dots span.cur{background:var(--accent)}
.dots span.r2{background:var(--ok)} .dots span.r1{background:var(--part)} .dots span.r0{background:var(--bad)}
label.f{display:block;font-weight:600;margin:12px 0 5px;font-size:13px}
input.t{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
input.t:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.fb .line{display:grid;grid-template-columns:22px 1fr;gap:8px;margin:6px 0}
.fb .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.ic.ok{background:var(--ok)} .ic.part{background:var(--part)} .ic.bad{background:var(--bad)}
.fb .ans{color:var(--ink);font-weight:600}
.fb .why{color:var(--ink-2);font-size:13px}
.hint{margin-top:12px;padding:9px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--ink-2);font-size:13px}
.opts{display:flex;gap:8px;margin:10px 0}
.opts button{flex:1}
.opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sumlist{list-style:none;padding:0;margin:10px 0}
.sumlist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sumlist .pt{font-variant-numeric:tabular-nums;color:var(--ink-3)}
.kbd{font-size:11.5px;color:var(--ink-3);margin-top:10px}
@media (max-width:1180px){#app{grid-template-columns:212px minmax(0,1fr) 330px}#hud{width:300px}}
@media (max-width:900px){
  #app{display:flex;flex-direction:column;height:auto}
  #stage{height:64vh;min-height:420px;order:2}
  #list{order:3;border-right:0;border-top:1px solid var(--line);padding:10px}
  #mlist{flex-direction:row;overflow-x:auto;gap:6px}
  #mlist li{flex:none;width:172px}
  #detail{order:4;border-left:0;border-top:1px solid var(--line)}
  .layers{width:100%}
  #hud{transform:scale(.86);transform-origin:left bottom}
}
@media (max-width:560px){#hud{display:none}.brand p{display:none}#caption .box{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="var(--accent)"/><path d="M13 4c0 5 1 8 2 10.4M21 4c0 5-1 8-2 10.4M12.6 16.2c1.6-1.6 7.2-1.6 8.8 0M14 30c0-5 .6-8 1.6-11.5M20 30c0-5-.6-8-1.6-11.5" stroke="var(--accent-ink)" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M8 18.5h5.2m7.6 0H26" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>
      <div><h1>Special Tests Atlas</h1><p>Twelve orthopedic maneuvers on a working skeleton, with muscles, ligaments, nerves and joint torques</p></div>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button role="tab" id="tab-learn" aria-selected="true">Learn</button>
      <button role="tab" id="tab-quiz" aria-selected="false">Quiz</button>
    </nav>
    <div class="layers" role="group" aria-label="Visible layers">
      <button class="layer" data-layer="muscles" aria-pressed="true"><i style="--c:var(--muscle)"></i>Muscles</button>
      <button class="layer" data-layer="ligaments" aria-pressed="true"><i style="--c:var(--ligament)"></i>Ligaments</button>
      <button class="layer" data-layer="nerves" aria-pressed="true"><i style="--c:var(--nerve)"></i>Nerves</button>
      <button class="layer" data-layer="forces" aria-pressed="true"><i style="--c:var(--torque)"></i>Forces and torques</button>
      <button class="layer" data-layer="hands" aria-pressed="true"><i style="--c:var(--glove)"></i>Examiner hands</button>
      <button class="layer" data-layer="focus" aria-pressed="true"><i style="--c:var(--accent)"></i>Fade untested</button>
      <button class="layer" data-layer="skin" aria-pressed="false"><i style="--c:var(--ink-3)"></i>Skin outline</button>
      <button class="layer" data-layer="labels" aria-pressed="true"><i style="--c:var(--ink)"></i>Labels</button>
    </div>
  </header>
  <aside id="list" aria-label="Maneuvers">
    <p class="list-note">Ranked from most to least commonly performed in routine exams</p>
    <p class="lock-note">The list is hidden during the quiz so it can't give answers away.</p>
    <ol id="mlist"></ol>
  </aside>
  <main id="stage">
    <canvas id="gl" aria-label="3D skeleton demonstrating the selected maneuver"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="caption" aria-live="polite"><div class="box"><div id="cap-title"></div><div id="cap-text"></div></div></div>
    <svg id="hud" viewBox="0 0 330 188" aria-hidden="true"></svg>
    <div id="controls">
      <button id="play" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="2" y="1.5" width="3.6" height="11" rx="1"/><rect x="8.4" y="1.5" width="3.6" height="11" rx="1"/></svg></button>
      <div class="track"><div id="ticks"></div><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Maneuver timeline"></div>
      <span id="tclock">0.0 s</span>
      <button id="speed" aria-label="Playback speed">1× speed</button>
      <button id="resetView">Reset view</button>
    </div>
    <div id="tip" hidden></div>
    <div id="loading">Building the skeleton…</div>
  </main>
  <aside id="detail" aria-live="polite">
    <section id="learn-panel" class="pad"></section>
    <section id="quiz-panel" class="pad" hidden></section>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>[hidden]{display:none!important}.toggle.acc[aria-pressed="true"] .sw{background:var(--accent)} #learn-panel .note+.meta{margin-top:8px}</style>
<script>
(function(){
'use strict';
const LOAD=document.getElementById('loading');
const fail=m=>{LOAD.textContent=m;LOAD.classList.add('err');LOAD.hidden=false;};
if(!window.THREE){fail('three.js could not be loaded from cdnjs.cloudflare.com. Check the connection and reload the page.');return;}
const T=THREE,D2R=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const V=(x=0,y=0,z=0)=>new T.Vector3(x,y,z),VA=a=>new T.Vector3(a[0],a[1],a[2]);
const col=h=>new T.Color(h).convertSRGBToLinear();
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const _v=V(),_ax=V();

/* ---------- geometry helpers ---------- */
function geoFrom(pos,nor,idx){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));if(nor)g.setAttribute('normal',new T.Float32BufferAttribute(nor,3));g.setIndex(idx);if(!nor)g.computeVertexNormals();return g;}
function crSample(P,sub){
  const n=P.length,out=[];if(n<2){out.push(P[0].clone());return out;}
  const m1=V(),m2=V();
  for(let i=0;i<n-1;i++){
    const p0=P[i>0?i-1:0],p1=P[i],p2=P[i+1],p3=P[i+2<n?i+2:n-1],d=p1.distanceTo(p2);
    m1.subVectors(p2,p0);m1.multiplyScalar(d/(m1.length()||1));
    m2.subVectors(p3,p1);m2.multiplyScalar(d/(m2.length()||1));
    for(let s=0;s<sub;s++){const t=s/sub,t2=t*t,t3=t2*t,a=2*t3-3*t2+1,b=t3-2*t2+t,c=-2*t3+3*t2,e=t3-t2;
      out.push(V(a*p1.x+b*m1.x+c*p2.x+e*m2.x,a*p1.y+b*m1.y+c*p2.y+e*m2.y,a*p1.z+b*m1.z+c*p2.z+e*m2.z));}
  }
  out.push(P[n-1].clone());return out;
}
function resample(D,N,out){
  const L=new Float32Array(D.length);for(let i=1;i<D.length;i++)L[i]=L[i-1]+D[i].distanceTo(D[i-1]);
  const tot=L[D.length-1]||1e-6;let j=0;
  for(let k=0;k<=N;k++){const s=tot*k/N;while(j<D.length-2&&L[j+1]<s)j++;const seg=(L[j+1]-L[j])||1e-6;out[k].lerpVectors(D[j],D[j+1],clamp((s-L[j])/seg,0,1));}
  return tot;
}
function tube(pts,rf,o={}){
  const seg=o.seg||18,rad=o.rad||12,P=pts.map(VA),D=P.length>2?crSample(P,10):P,S=[];
  for(let i=0;i<=seg;i++)S.push(V());resample(D,seg,S);
  const pos=[],nor=[],idx=[],up=o.up?VA(o.up).normalize():null,Tg=V(),B=V(),tmp=V();let N=null;
  for(let i=0;i<=seg;i++){
    if(i===0)Tg.subVectors(S[1],S[0]);else if(i===seg)Tg.subVectors(S[seg],S[seg-1]);else Tg.subVectors(S[i+1],S[i-1]);Tg.normalize();

function buildTicks(){const m=ST.m;let h='',last=-1;m.keys.forEach((k,i)=>{if(m.sT[i]!==last){last=m.sT[i];h+=`<span style="left:${(k.t/m.dur*100).toFixed(2)}%"></span>`;}});$('#ticks').innerHTML=h;}
function applyRupture(){const m=ST.m;for(const id in RIG.cords){const c=RIG.cords[id];c.ruptured=ST.pos&&m.pos.rupture.includes(c.id);c.sig=NaN;}}
function select(i,opts={}){
  ST.idx=i;ST.m=MANEUVERS[i];const m=ST.m;prepare(m);
  setPosture(m.posture);setTested(m);applyRupture();precompute(m);buildHUD(m);buildLabels(m);
  ST.t=0;evalAt(0);ST.capKey='';
  document.querySelectorAll('#mlist button').forEach((b,k)=>b.setAttribute('aria-current',k===i&&ST.mode==='learn'?'true':'false'));
  if(ST.mode==='learn')renderLearn();buildTicks();camGoal(m,opts.instant);
  canvas.setAttribute('aria-label',(ST.mode==='quiz'?'Mystery maneuver':m.name)+' demonstrated on a 3D skeleton');
}
function setPos(on){ST.pos=on;applyRupture();precompute(ST.m);buildHUD(ST.m);evalAt(ST.t);const b=$('#posToggle');if(b)b.setAttribute('aria-pressed',String(on));}
function setPlay(p){ST.play=p;const b=$('#play');b.setAttribute('aria-label',p?'Pause':'Play');b.innerHTML=p?'<svg viewBox="0 0 14 14"><rect x="2" y="1.5" width="3.6" height="11" rx="1"/><rect x="8.4" y="1.5" width="3.6" height="11" rx="1"/></svg>':'<svg viewBox="0 0 14 14"><path d="M3 1.6v10.8l9.4-5.4z"/></svg>';}
$('#play').onclick=()=>setPlay(!ST.play);
const scrub=$('#scrub');scrub.addEventListener('input',()=>{ST.t=scrub.value/1000*ST.m.dur;setPlay(false);});
const SPEEDS=[1,.5,.25,2];let spI=0;$('#speed').onclick=()=>{spI=(spI+1)%SPEEDS.length;ST.speed=SPEEDS[spI];$('#speed').textContent=SPEEDS[spI]+'× speed';};
$('#resetView').onclick=()=>camGoal(ST.m);
document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>{const k=b.dataset.layer;ST.layers[k]=!ST.layers[k];b.setAttribute('aria-pressed',String(ST.layers[k]));for(const s of SKIN)s.visible=ST.layers.skin;});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;const free=e.target===document.body||e.target===canvas;
  if(e.code==='Space'&&free){e.preventDefault();setPlay(!ST.play);}else if(free&&ST.mode==='learn'&&e.key==='ArrowRight')select((ST.idx+1)%12);else if(free&&ST.mode==='learn'&&e.key==='ArrowLeft')select((ST.idx+11)%12);});

/* ---------- quiz: fuzzy matching ---------- */
const STOP=new Set('test tests testing sign signs the a an of for maneuver manoeuvre maneuvre exam examination and or to is it this that checks check checking assesses assess assessing evaluates evaluate evaluating looks look at in on with its used use detect detects detecting rule out possible integrity function pathology problem problems injury injuries'.split(' '));
const ANT=[['anterior','posterior'],['medial','lateral'],['internal','external'],['flexion','extension'],['upper','lower'],['abduction','adduction'],['radial','ulnar']];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’`]s\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const toks=s=>norm(s).split(' ').filter(w=>w&&!STOP.has(w));
function osa(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++){d.push(new Array(n+1).fill(0));d[i][0]=i;}for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[m][n];}
const sim=(a,b)=>a===b?1:!a||!b?0:1-osa(a,b)/Math.max(a.length,b.length);
const isAnt=(t,u)=>ANT.some(([x,y])=>(t===x&&u===y)||(t===y&&u===x));
function tokSim(t,u){if(t===u)return 1;if(isAnt(t,u))return 0;if(t.length<=3||u.length<=3)return 0;let s=sim(t,u);if(u.length>=5&&t.startsWith(u))s=Math.max(s,.86);if(t.length>=5&&u.startsWith(t))s=Math.max(s,.9);return s;}
function phraseScore(phrase,ans){
  const pt=toks(phrase),at=toks(ans);if(!pt.length||!at.length)return 0;
  if((' '+at.join(' ')+' ').includes(' '+pt.join(' ')+' '))return 1;
  let tot=0,w=0;for(const t of pt){let b=0;for(const u of at)b=Math.max(b,tokSim(t,u));tot+=b*t.length;w+=t.length;}let best=tot/w;
  const conflict=pt.some(t=>at.some(u=>isAnt(t,u)));const pj=pt.join('');
  if(!conflict&&pj.length>=4)for(let i=0;i<at.length;i++){let s='';for(let k=i;k<Math.min(at.length,i+pt.length+1);k++){s+=at[k];if(s.length>=3)best=Math.max(best,sim(s,pj));}}
  return best;
}
function nameScore(m,ans){let best=0;for(const a of m.names)best=Math.max(best,phraseScore(a,ans));return best;}
function judgeName(m,ans){
  if(!norm(ans))return {ok:false,score:0};const mine=nameScore(m,ans);let other=null;
  for(const o of MANEUVERS){if(o===m)continue;const s=nameScore(o,ans);if(!other||s>other.s)other={m:o,s};}
  const ok=mine>=.78&&!(other&&other.s>mine+.08);
  if(!ok)for(const h of (m.nameHints||[]))for(const t of h.terms)if(phraseScore(t,ans)>=.85)return {ok:false,score:mine,msg:h.msg};
  return {ok,score:mine,other:!ok&&other&&other.s>=.78?other.m:null};
}
function judgeWhat(m,ans){
  if(!norm(ans))return {level:0};
  const primHit=m.concepts.filter(c=>c.p).some(c=>c.terms.some(t=>phraseScore(t,ans)>=.84));
  if(!primHit)for(const w of (m.wrong||[]))for(const t of w.terms)if(phraseScore(t,ans)>=.88)return {level:0,msg:w.msg};
  let prim=null,sec=null;
  for(const c of m.concepts)for(const t of c.terms){if(phraseScore(t,ans)>=.84){if(c.p){if(!prim)prim={c,t};}else if(!sec)sec={c,t};}}
  if(prim)return {level:2,hit:prim.t};if(sec)return {level:1,hit:sec.t,msg:sec.c.msg};return {level:0};
}

/* ---------- quiz flow ---------- */
const Q={order:[],i:0,score:0,res:[],rounds:12,forces:true,answered:false,hints:0};
const fmtPts=p=>String(Math.round(p*100)/100);
function setMode(mode){
  ST.mode=mode;$('#tab-learn').setAttribute('aria-selected',String(mode==='learn'));$('#tab-quiz').setAttribute('aria-selected',String(mode==='quiz'));
  $('#learn-panel').hidden=mode!=='learn';$('#quiz-panel').hidden=mode!=='quiz';$('#list').classList.toggle('quiz-locked',mode==='quiz');
  ST.quizReveal=false;ST.quizHints=0;ST.capKey='';if(mode==='learn')select(ST.idx);else quizIntro();
}
$('#tab-learn').onclick=()=>setMode('learn');$('#tab-quiz').onclick=()=>setMode('quiz');
function quizIntro(){
  ST.quizReveal=false;ST.quizHints=0;if(ST.pos)setPos(false);
  const P=$('#quiz-panel');P.innerHTML=`<h2>Name that maneuver</h2><p class="lead">A maneuver plays on the skeleton with its name, labels and highlights hidden. Type what it is and what it tests. Spelling doesn’t need to be perfect.</p>
  <div class="grp">Number of rounds</div><div class="opts" id="qRounds"><button class="btn" data-n="6" aria-pressed="${Q.rounds===6}">6 rounds</button><button class="btn" data-n="12" aria-pressed="${Q.rounds===12}">All 12</button></div>
  <button class="toggle acc" id="qForces" aria-pressed="${Q.forces}"><span class="sw"></span><span><b>Show forces and torques</b><small>The arrows can be a clue. Turn them off for a harder quiz.</small></span></button>
  <div class="row"><button class="btn primary" id="qStart">Start quiz</button></div>
  <p class="kbd">Scoring: 1 point for the name and 1 for what it tests (half for a partly right answer). Each hint costs a quarter point.</p>`;
  P.querySelectorAll('#qRounds button').forEach(b=>b.onclick=()=>{Q.rounds=+b.dataset.n;P.querySelectorAll('#qRounds button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
  $('#qForces').onclick=()=>{Q.forces=!Q.forces;$('#qForces').setAttribute('aria-pressed',String(Q.forces));};$('#qStart').onclick=()=>quizStart();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quizStart(list){Q.order=list||shuffle(MANEUVERS.map((_,i)=>i)).slice(0,Q.rounds);Q.i=0;Q.score=0;Q.res=[];quizRound();}
function quizRound(){Q.answered=false;Q.hints=0;ST.quizReveal=false;ST.quizHints=0;if(ST.pos)ST.pos=false;select(Q.order[Q.i]);setPlay(true);renderQuiz();}
const dotsHTML=()=>Q.order.map((_,k)=>{const r=Q.res[k];return `<span class="${r?'r'+(r.pts>=1.75?2:r.pts>=.75?1:0):k===Q.i?'cur':''}"></span>`;}).join('');
function renderQuiz(){
  const P=$('#quiz-panel');
  P.innerHTML=`<div class="qhead"><span class="qprog">Round ${Q.i+1} of ${Q.order.length}</span><span class="qscore"><span id="qPts">${fmtPts(Q.score)}</span> <small style="font:13px var(--sans);color:var(--ink-3)">points</small></span></div><div class="dots" id="qDots">${dotsHTML()}</div>
  <h2>What maneuver is this?</h2>
  <label class="f" for="qName">Maneuver name</label><input class="t" id="qName" autocomplete="off" spellcheck="false" placeholder="For example, Lachman test">
  <label class="f" for="qWhat">What does it test?</label><input class="t" id="qWhat" autocomplete="off" spellcheck="false" placeholder="For example, ACL integrity">
  <div class="row" id="qBtns"><button class="btn primary" id="qCheck">Check answer</button><button class="btn" id="qHintB">Show a hint</button><button class="btn" id="qReveal">Reveal answer</button></div>
  <div id="qHint"></div><div id="qFb"></div><p class="kbd">Press Enter to check. Drag the 3D view to look from another angle.</p>`;
  $('#qCheck').onclick=()=>quizCheck(false);$('#qReveal').onclick=()=>quizCheck(true);$('#qHintB').onclick=quizHint;
  ['qName','qWhat'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();if(id==='qName'&&!$('#qWhat').value.trim())$('#qWhat').focus();else quizCheck(false);}));
  setTimeout(()=>{const n=$('#qName');if(n)n.focus({preventScroll:true});},60);
}
function quizHint(){if(Q.answered)return;Q.hints=Math.min(2,Q.hints+1);ST.quizHints=Q.hints;const m=ST.m;
  const h=[`Region: ${m.joint.toLowerCase()}; the patient is ${POSTURE[m.posture].toLowerCase()}.`,'The structures under test now glow on the skeleton.'];
  $('#qHint').innerHTML=`<div class="hint">${h.slice(0,Q.hints).map(esc).join('<br>')}</div>`;if(Q.hints>=2)$('#qHintB').disabled=true;}
function quizCheck(giveUp){
  if(Q.answered)return;const m=ST.m,nameA=$('#qName').value,whatA=$('#qWhat').value;
  if(!giveUp&&!nameA.trim()&&!whatA.trim()){$('#qName').focus();return;}
  const nr=giveUp?{ok:false}:judgeName(m,nameA),wr=giveUp?{level:0}:judgeWhat(m,whatA);
  const pts=Math.max(0,(nr.ok?1:0)+(wr.level===2?1:wr.level===1?.5:0)-.25*Q.hints);
  Q.score+=pts;Q.res[Q.i]={m,pts};Q.answered=true;ST.quizReveal=true;$('#qName').disabled=$('#qWhat').disabled=true;
  const said=esc(nameA.trim());
  const nameWhy=giveUp?'':nr.ok?(nr.score>.99?'Exactly right.':`You wrote “${said}”, which is close enough.`):!said?'No name given.':nr.msg?esc(nr.msg):nr.other?`“${said}” is the ${esc(nr.other.name)}, a different maneuver.`:`You wrote “${said}”.`;
  const whatWhy=giveUp?'':wr.level===2?`Matched “${esc(wr.hit)}”.`:wr.level===1?`Partly right (“${esc(wr.hit)}”). ${esc(wr.msg||'')}`:whatA.trim()?esc(wr.msg||'That isn’t what this maneuver loads.'):'No answer given.';
  const ic=lv=>lv===2?'<span class="ic ok" aria-label="Correct">✓</span>':lv===1?'<span class="ic part" aria-label="Partly correct">½</span>':'<span class="ic bad" aria-label="Incorrect">✗</span>';
  $('#qFb').innerHTML=`<div class="fb"><div class="line">${ic(nr.ok?2:0)}<div><span class="ans">${esc(m.name)}</span><div class="why">${nameWhy}</div></div></div><div class="line">${ic(wr.level)}<div><span class="ans">${esc(m.answer)}</span><div class="why">${whatWhy}</div></div></div><p class="why" style="margin:8px 0 0">${fmtPts(pts)} of 2 points this round${Q.hints?` (hints −${fmtPts(Q.hints*.25)})`:''}. Labels, highlights and the live readout are now showing.</p></div>`;
  const last=Q.i>=Q.order.length-1;
  $('#qBtns').innerHTML=`<button class="btn primary" id="qNext">${last?'See results':'Next maneuver'}</button><button class="btn" id="qLearn">Study it in Learn mode</button>`;
  $('#qNext').onclick=()=>{if(last)quizEnd();else{Q.i++;quizRound();}};$('#qLearn').onclick=()=>{ST.idx=Q.order[Q.i];setMode('learn');};
  $('#qNext').focus({preventScroll:true});$('#qPts').textContent=fmtPts(Q.score);$('#qDots').innerHTML=dotsHTML();ST.capKey='';
}
function quizEnd(){
  const P=$('#quiz-panel'),max=Q.order.length*2,missed=Q.order.filter((_,k)=>Q.res[k]&&Q.res[k].pts<1.75);
  P.innerHTML=`<h2>${fmtPts(Q.score)} of ${max} points</h2><p class="lead">${Q.score>=max*.85?'Excellent. You know these maneuvers well.':Q.score>=max*.6?'Solid. Review the ones marked below.':'Worth another pass; Learn mode walks through every step.'}</p>
  <ul class="sumlist">${Q.order.map((_,k)=>{const r=Q.res[k],c=r.pts>=1.75?'ok':r.pts>=.75?'part':'bad';return `<li><span class="ic ${c}">${c==='ok'?'✓':c==='part'?'½':'✗'}</span><span>${esc(r.m.name)}</span><span class="pt">${fmtPts(r.pts)} / 2</span></li>`;}).join('')}</ul>
  <div class="row">${missed.length?`<button class="btn primary" id="qRetry">Retry the ${missed.length} I missed</button>`:''}<button class="btn" id="qNew">New quiz</button></div>`;
  if(missed.length)$('#qRetry').onclick=()=>quizStart(shuffle(missed.slice()));$('#qNew').onclick=quizIntro;
}

/* ---------- main loop ---------- */
function resize(){const r=$('#stage').getBoundingClientRect(),w=Math.max(10,r.width),h=Math.max(10,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function applyTheme(){const h=(cssVar('--floor')||'#cdd6dd').replace('#','');floorMat.color.copy(col(parseInt(h,16)));}
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;const clock=now/1000;
  try{
    if(ST.play){ST.t+=dt*ST.speed;if(ST.t>=ST.m.dur)ST.t-=ST.m.dur;}
    evalAt(ST.t);for(const id in RIG.cords)RIG.cords[id].update(false);
    computeForces();drawForces();updateHands();drawEffects(clock);applyLook(clock);updateCamera(dt);
    renderer.render(scene,camera);updateLabels();updateHUD();updateCaption();
    if(ST.play)scrub.value=Math.round(ST.t/ST.m.dur*1000);$('#tclock').textContent=ST.t.toFixed(1)+' s';
  }catch(err){console.error(err);fail('The animation stopped: '+err.message);return;}
  requestAnimationFrame(loop);
}
try{
  buildSkeleton();buildCords();initClav();buildSkin();
  applyPoseFull(zeroPose());body.position.set(0,0,0);body.quaternion.set(0,0,0,1);body.updateMatrixWorld(true);
  for(const id in RIG.cords){const c=RIG.cords[id];c.L0=c.measure();}
  applyTheme();buildList();
  if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',applyTheme);}
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));else addEventListener('resize',resize);resize();
  if(matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)ST.speed=.5,$('#speed').textContent='0.5× speed',spI=1;
  select(0,{instant:true});LOAD.hidden=true;requestAnimationFrame(loop);
}catch(err){console.error(err);fail('Something went wrong while building the scene: '+err.message);}
window.__atlas={ST,RIG,MANEUVERS,select,setPos,evalAt,judgeName,judgeWhat,X,FS,MF,CUR,setMode,quizStart,clearance,computeForces,precompute};
})();
</script>
</body></html>
