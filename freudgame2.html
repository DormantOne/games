
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Spiel des Lebens: a Freudian Game of Life</title>
<meta name="description" content="Milton Bradley's Game of Life, redrawn after Sigmund Freud. Drive a Viennese Fiaker from birth to the Day of Reckoning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --rug:#5B1613; --rug-deep:#44100E; --indigo:#1E2744; --indigo-2:#2B3760;
  --gold:#C9A13B; --gold-hi:#E8C872; --gold-lo:#8A6A1E;
  --bone:#E8E1CC; --bone-2:#DDD4BA; --paper:#F3EFE2;
  --ink:#1B1511; --ink-2:#54473A; --black:#000;
  --verd:#3F7E6D; --madder:#9C2A24;
  --sans:"Josefin Sans","Futura","Century Gothic","Avenir Next","DejaVu Sans",sans-serif;
  --serif:"Spectral","Lora",Georgia,"Times New Roman",serif;
  --checker:repeating-conic-gradient(#000 0 25%, var(--bone) 0 50%) 0 0/12px 12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--bone); font-family:var(--serif); font-size:16px; line-height:1.5;
  background-color:var(--rug);
  background-image:
    radial-gradient(circle, rgba(232,225,204,.16) 1.3px, transparent 1.8px),
    linear-gradient(45deg, transparent 46%, rgba(30,39,68,.5) 46%, rgba(30,39,68,.5) 54%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, rgba(30,39,68,.5) 46%, rgba(30,39,68,.5) 54%, transparent 54%),
    radial-gradient(ellipse at 50% 30%, rgba(255,210,160,.06), transparent 70%);
  background-size:34px 34px,34px 34px,34px 34px,100% 100%;
  background-position:17px 17px,0 0,0 0,0 0;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;
  gap:12px 20px;max-width:1760px;margin:0 auto;padding:10px 20px 16px;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
#brandTitle .title-art{height:46px;display:block}
.tagline{margin:0 0 3px;font-style:italic;color:var(--bone-2);font-size:15px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.link{background:none;border:0;padding:8px 10px 6px;font-family:var(--sans);font-size:15px;color:var(--bone);cursor:pointer;
  border-bottom:2px solid transparent}
.link:hover{border-bottom-color:var(--gold)}
.link[aria-pressed="false"]{color:var(--bone-2);opacity:.75}

.board-col{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.board-frame{position:relative;padding:9px;background:var(--checker);box-shadow:0 22px 50px rgba(0,0,0,.45);
  width:min(100%, calc((100vh - 190px) * 1.6 + 18px));min-width:min(100%,640px)}
#board{display:block;width:100%;height:auto;aspect-ratio:1600/1000;background:var(--bone);touch-action:pan-y;user-select:none}
#board.zoomed{touch-action:none;cursor:grab}
#board.dragging{cursor:grabbing}
.board-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;width:min(100%, calc((100vh - 190px) * 1.6 + 18px));min-width:min(100%,640px)}
.zoom{display:flex;gap:4px;flex:none}
.zoom button{min-width:34px;height:32px;padding:4px 8px 2px;background:var(--paper);border:2px solid #000;color:var(--ink);
  font:600 16px/1 var(--sans);cursor:pointer}
.zoom button:hover{background:#000;color:var(--gold-hi)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:14px var(--sans);color:var(--bone)}
.legend .lg{display:inline-flex;align-items:center;gap:6px;padding-top:2px}
.legend svg{flex:none}

/* ---------- board svg text ---------- */
.road-edge{fill:none;stroke:var(--gold);stroke-width:41;stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:#1C1612;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.road-ring{fill:none;stroke:var(--gold-hi);stroke-width:3;stroke-dasharray:1 13;stroke-linecap:round;opacity:.85}
.road-end{fill:none;stroke:#1C1612;stroke-width:5;stroke-dasharray:9 7}
.space{cursor:help}
.space:focus{outline:none}
.space.current > circle:nth-of-type(2), .space.current > rect{stroke:var(--gold-hi)}
.stop-label{font:600 18px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--bone);stroke-width:6px;stroke-linejoin:round}
.cap-de{font:300 36px var(--sans);fill:var(--gold-lo)}
.cap-en{font:italic 16px var(--serif);fill:var(--ink-2)}
.sign{font:600 11px var(--sans);fill:var(--bone);text-anchor:middle}
.sign-ink{font:600 13px var(--sans);fill:var(--ink)}
.tiny{font:600 6.5px var(--sans);fill:var(--ink);letter-spacing:.08em}
.tiny-bone{font:700 11px var(--sans);fill:var(--bone)}
.war{font:600 15px var(--sans);fill:var(--gold-hi);letter-spacing:.06em}
.note{font:700 9px var(--sans);fill:var(--gold-lo)}
.token{filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.4));pointer-events:none}

/* ---------- side ---------- */
.side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.turnbox{display:flex;align-items:center;gap:12px;padding:6px 2px;border-bottom:2px solid var(--pc,var(--gold))}
.turn-name{font:600 23px/1.1 var(--sans);color:var(--paper);padding-top:3px}
.turn-sub{font-style:italic;color:var(--bone-2);font-size:15px}
.wheelbox{position:relative;background:var(--indigo);padding:12px 14px 12px;box-shadow:inset 0 0 0 1px rgba(232,200,114,.25);
  background-image:radial-gradient(circle at 20% 18%,rgba(232,200,114,.35) 0 1px,transparent 1.5px),radial-gradient(circle at 78% 12%,rgba(232,200,114,.3) 0 1px,transparent 1.5px),radial-gradient(circle at 60% 30%,rgba(232,200,114,.25) 0 1px,transparent 1.5px),radial-gradient(circle at 88% 44%,rgba(232,200,114,.25) 0 1px,transparent 1.5px),radial-gradient(circle at 10% 52%,rgba(232,200,114,.2) 0 1px,transparent 1.5px)}
.wheel-cap{position:absolute;left:14px;top:10px;font:14px var(--sans);color:var(--gold-hi)}
.wheel-cap em{display:block;font:italic 13px var(--serif);color:var(--bone-2)}
#wheel{display:block;width:100%;max-width:300px;margin:0 auto;height:auto}
#wheel .frame line,#wheel .frame path{stroke:var(--gold-lo);stroke-width:4;fill:none;stroke-linecap:round}
#wheel .ground{fill:var(--gold-lo)}
#wheel .rim{fill:none;stroke:var(--gold);stroke-width:3.2}
#wheel .rim2{fill:none;stroke:var(--gold);stroke-width:1.6}
#wheel .truss line{stroke:var(--gold);stroke-width:1}
#wheel .spokes line{stroke:var(--gold);stroke-width:.8;opacity:.85}
#wheel .lights circle{fill:var(--gold-hi)}
#wheel .hub{fill:var(--gold)}
#wheel .hub2{fill:var(--indigo)}
#wheel .hanger{stroke:var(--gold-hi);stroke-width:1.6}
#wheel .cabin{fill:var(--madder);stroke:#000;stroke-width:1.2}
#wheel .win{fill:var(--paper);opacity:.9}
#wheel .sill{fill:#000}
#wheel .gnum{font:700 13px var(--sans);fill:var(--gold-hi);text-anchor:middle}
#wheel .pivot{fill:var(--gold-hi)}
#wheel .pointer{fill:var(--gold-hi);stroke:#000;stroke-width:1.2}
#wheel .gondola.won .cabin{fill:var(--gold)}
#wheel .gondola.won .gnum{fill:#000}
.spin-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.spin-row .btn{flex:1}
#spinOut{min-width:46px;height:46px;display:grid;place-items:center;font:600 28px/1 var(--sans);color:var(--gold-hi);
  border:2px solid var(--gold);padding-top:4px}
#spinOut:empty{opacity:.35}
.hint{margin:6px 0 0;min-height:1.2em;font-size:14px;font-style:italic;color:var(--bone-2);text-align:center}

.ledger{background:var(--bone);color:var(--ink);padding:0 14px 12px;position:relative}
.ledger::before{content:"";display:block;height:8px;margin:0 -14px 10px;background:var(--checker);background-size:8px 8px}
.lg-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lg-name{font:600 19px var(--sans);padding-top:2px}
.lg-real{font-style:italic;font-size:14px;color:var(--ink-2)}
.lg-top{display:flex;gap:12px;align-items:flex-start;margin:8px 0 8px}
.lg-egg{line-height:0;flex:none}
.lg-grid{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:6px 10px}
.stat{border-top:2px solid var(--ink);padding-top:3px}
.stat .k{display:block;font:13px var(--sans);color:var(--ink-2)}
.stat .v{display:block;font:600 21px/1.15 var(--sans);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.stat.big .v{font-size:22px}
.stat .s{display:block;font-size:12.5px;color:var(--madder)}
.lg-list{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14.5px;line-height:1.35}
.lg-list dt{font:13.5px var(--sans);color:var(--ink-2);padding-top:3px}
.lg-list dd{margin:0}
.muted{color:var(--ink-2);font-style:italic}
.tag{display:inline-block;font:13px var(--sans);padding:3px 6px 1px;margin:0 4px 3px 0;border:1.5px solid var(--ink)}
.tag.def{border-color:var(--verd);color:#23473D}
.tag.sym{border-color:var(--madder);color:var(--madder)}
.tag.tr{border-color:var(--indigo-2);color:var(--indigo-2)}

.notes{background:var(--indigo-2);padding:10px 14px;min-height:140px;flex:1;display:flex;flex-direction:column;
  background-image:linear-gradient(transparent 27px, rgba(232,225,204,.08) 28px);background-size:100% 28px}
.notes h3{margin:0 0 4px;font:600 16px var(--sans);color:var(--gold-hi)}
#log{list-style:none;margin:0;padding:0;overflow:auto;flex:1;max-height:320px;font-size:14px;line-height:1.4;color:var(--bone)}
#log li{display:flex;gap:8px;padding:3px 0}
#log .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;box-shadow:0 0 0 1.5px var(--bone)}
#log em{color:var(--gold-hi)}

/* ---------- strip ---------- */
.strip{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pchip{display:flex;flex-direction:column;gap:6px;background:var(--bone);color:var(--ink);border-left:8px solid var(--pc);padding:7px 12px 8px 9px}
.pchip.on{box-shadow:0 0 0 3px var(--gold-hi)}
.pchip.retired{opacity:.78}
.pc-main{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.pc-t{display:flex;flex-direction:column}
.pc-n{font:600 15px var(--sans);padding-top:2px}
.pc-n em{font:italic 13px var(--serif);color:var(--ink-2);font-weight:400}
.pc-s{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pc-end{font:italic 13px var(--serif);color:var(--madder)}
.pc-psy{display:flex;align-items:center;gap:9px}
.pc-egg{display:block;line-height:0}
.pc-nb{margin-left:auto;display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1.5px solid #000;padding:3px 7px 1px;cursor:pointer;font:600 13px var(--sans);color:var(--ink)}
.pc-nb:hover{background:#000;color:var(--gold-hi)}

/* ---------- buttons ---------- */
.btn{font:600 16px/1.15 var(--sans);padding:11px 16px 8px;border:2px solid #000;background:var(--paper);color:var(--ink);cursor:pointer;
  display:inline-flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.btn small{font:italic 13px var(--serif);font-weight:400;color:var(--ink-2)}
.btn:hover:not(:disabled){background:#000;color:var(--gold-hi)}
.btn:hover:not(:disabled) small{color:var(--bone-2)}
.btn.primary{background:#000;color:var(--gold-hi)}
.btn.primary small{color:var(--bone-2)}
.btn.primary:hover:not(:disabled){background:var(--gold);color:#000}
.btn.primary:hover:not(:disabled) small{color:#000}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{font-size:18px;padding:13px 22px 10px}
.btn.chosen{outline:3px solid var(--gold-hi);outline-offset:3px}
.wheelbox .btn.primary{border-color:var(--gold)}

/* ---------- toasts & tip ---------- */
#toasts{position:absolute;left:20px;top:20px;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(330px,60%)}
.toast{background:var(--paper);color:var(--ink);border-left:7px solid var(--pc);padding:8px 12px 9px;box-shadow:0 8px 22px rgba(0,0,0,.28);
  font-size:14.5px;line-height:1.35;transition:opacity .35s, transform .35s}
.toast strong{display:block;font:600 15.5px var(--sans);padding-top:2px}
.toast span{display:block}
.toast.out{opacity:0;transform:translateY(-6px)}
.tip{position:absolute;width:280px;background:var(--paper);color:var(--ink);border:2px solid #000;padding:9px 12px 10px;pointer-events:none;
  transform:translateY(-100%);box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:5;font-size:14px;line-height:1.4}
.tip.below{transform:none}
.tip strong{font:600 16px var(--sans)}
.tip em{color:var(--ink-2)}
.tip span{display:block;margin-top:3px}

/* ---------- overlay & cards ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(24,6,4,.55);overflow:auto}
.overlay.top{z-index:30}
.overlay[hidden]{display:none}
.card{padding:10px;background:var(--checker);width:min(600px,100%);box-shadow:0 30px 70px rgba(0,0,0,.5);margin:auto}
.card.wide{width:min(1120px,100%)}
.card.small{width:min(440px,100%)}
.card-in{background:var(--bone);color:var(--ink);padding:24px 30px 24px;position:relative}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-ic{width:42px;height:42px;display:grid;place-items:center;flex:none}
.kicker{font:15px var(--sans);color:var(--ink-2);padding-top:3px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font:600 15px var(--sans);padding-top:2px}
.card h2{font:600 30px/1.12 var(--sans);margin:4px 0 10px;padding-top:4px;text-wrap:balance}
.card h2 em{font:italic 400 20px var(--serif);color:var(--ink-2)}
.card-text{font-size:18px;line-height:1.58;margin:0 0 12px;max-width:62ch}
.card-note{font:15.5px/1.45 var(--sans);margin:0 0 12px;padding:9px 12px 7px;border:1.5px solid var(--gold);background:var(--paper)}
.card-src{font-style:italic;color:var(--ink-2);font-size:14.5px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chip{font:600 14px var(--sans);padding:5px 9px 3px;background:var(--ink);color:var(--paper)}
.chip.good{background:var(--verd)}
.chip.bad{background:var(--madder)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.card.numbers .card-actions .btn{min-width:52px}
.ai-note{margin:12px 0 0;font-style:italic;color:var(--ink-2);font-size:14px}
.offer,.lines{margin:0 0 12px;padding:0;list-style:none;font-size:16px;line-height:1.45}
.offer li,.lines li{padding:6px 0 6px 16px;border-top:1px solid var(--bone-2);position:relative}
.offer li::before,.lines li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;background:var(--gold-lo);transform:rotate(45deg)}
.offer em{color:var(--ink-2)}

/* setup */
.setup .card-in{padding:18px 30px 0;max-height:calc(100vh - 40px);overflow:auto}
.setup-foot{position:sticky;bottom:0;background:var(--bone);border-top:2px solid #000;margin:14px -30px 0;padding:12px 30px 16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.setup-foot .setup-row{margin:0}
.setup-foot .card-actions{margin:0}
.setup-title .title-art{width:min(640px,100%);height:auto;display:block;margin:4px auto 0}
.setup-title .title-art .t-glyphs path{stroke:#000}
.setup-title .title-art .t-checks rect{fill:#000}
.setup-title .title-art .t-orns rect{fill:var(--gold)}
.setup-sub{max-width:68ch;margin:10px auto 6px;text-align:center;font-size:17px;line-height:1.5}
.setup h3{font:600 20px var(--sans);margin:14px 0 10px}
.setup h4{font:15px var(--sans);color:var(--ink-2);margin:0 0 6px}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ptile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--paper);border:2px solid var(--bone-2);
  border-top:7px solid var(--pc);padding:12px 14px 14px;cursor:pointer;color:var(--ink)}
.ptile:hover{border-color:#000;border-top-color:var(--pc)}
.ptile.on{border-color:#000;border-top-color:var(--pc);box-shadow:0 0 0 3px var(--gold)}
.pt-name{font:600 19px var(--sans);padding-top:4px}
.pt-real{font-style:italic;color:var(--ink-2);font-size:14.5px}
.pt-blurb{font-size:14.5px;line-height:1.45;margin:2px 0 4px}
.pt-ab,.pt-wk{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.pt-ab b,.pt-wk b{font:600 13.5px var(--sans);color:var(--ink)}
.setup-row{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:14px 34px;margin:18px 0 14px}
.seg{display:inline-flex;border:2px solid #000}
.seg-b{font:600 15px var(--sans);padding:9px 14px 6px;background:var(--paper);border:0;border-right:2px solid #000;cursor:pointer;color:var(--ink)}
.seg-b:last-child{border-right:0}
.seg-b.on{background:#000;color:var(--gold-hi)}

/* codex */
.codex .card-in{padding:20px 30px 18px}
.cx-head{display:flex;align-items:center;justify-content:space-between}
.cx-head h2{margin:0}
.tabs{display:flex;gap:4px;border-bottom:2px solid #000;margin:12px 0 0;flex-wrap:wrap}
.tab{font:600 16px var(--sans);padding:9px 14px 6px;background:none;border:0;cursor:pointer;color:var(--ink-2)}
.tab.on{background:#000;color:var(--gold-hi)}
.cx-body{max-height:min(66vh,760px);overflow:auto;padding:4px 6px 4px 0;columns:2 420px;column-gap:34px}
.cx{break-inside:avoid;padding:14px 0 8px;border-bottom:1px solid var(--bone-2)}
.cx h3{font:600 19px var(--sans);margin:0 0 2px;padding-top:2px}
.cx h3 em{font:italic 400 16px var(--serif);color:var(--ink-2)}
.cx p{margin:0 0 8px;font-size:16px;line-height:1.55}
.cx .cx-src{font-style:italic;color:var(--ink-2);font-size:14px}
.cx .cx-b{font-size:15px;padding-left:10px;border-left:3px solid var(--gold)}
.cx .cx-b b{font:600 14.5px var(--sans)}
.cx.case{display:flex;gap:14px}
.cx.case .medal{flex:none;margin-top:4px}

/* final */
.final h2{font-size:34px;margin-bottom:14px}
.ranking{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ranking > li{background:var(--paper);border-left:8px solid var(--pc);padding:12px 16px}
.rk-head{display:flex;align-items:center;gap:12px}
.rk-n{font:300 30px var(--sans);width:26px;padding-top:4px}
.rk-t{display:flex;flex-direction:column}
.rk-t strong{font:600 19px var(--sans);padding-top:2px}
.rk-t span{font-style:italic;color:var(--ink-2);font-size:14.5px}
.rk-total{margin-left:auto;font:600 24px var(--sans);font-variant-numeric:tabular-nums;padding-top:3px}
.rk-bars{display:grid;gap:3px;margin:10px 0 6px;max-width:640px}
.rk-bars > div{display:grid;grid-template-columns:78px 1fr 110px;align-items:center;gap:10px}
.bl{font:14px var(--sans);color:var(--ink-2);padding-top:2px}
.bv{font:600 14px var(--sans);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.bar{height:10px;background:var(--bone-2);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar.love i{background:var(--madder)}
.bar.work i{background:var(--gold)}
.bar.neur i{background:var(--indigo-2)}
.ranking details summary{cursor:pointer;font:600 15px var(--sans);padding:6px 0 2px}
.history,.epilogue{font-size:16px;line-height:1.58;margin:6px 0;max-width:78ch}
.epilogue b{font:600 15px var(--sans)}
.breakdown{font-size:13.5px;color:var(--ink-2);margin:6px 0 2px}

/* title art in the header */
.title-art .t-glyphs path{fill:none;stroke:var(--gold);stroke-width:8.5;stroke-linecap:square;stroke-linejoin:miter}
.title-art .t-checks rect{fill:var(--gold)}
.title-art .t-orns rect{fill:var(--gold-hi)}

/* ---------- responsive ---------- */
@media (max-width:1180px){

  .side{grid-row:3;display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .turnbox{grid-column:1/-1}
  .strip{grid-row:4}
  .board-frame,.board-tools{width:100%;min-width:0}

}
@media (max-width:720px){
  .side{grid-template-columns:1fr}

  .card-text{font-size:17px}

  .cx-body{columns:1}
  .rk-bars > div{grid-template-columns:64px 1fr 90px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

.psy{display:block;height:auto;overflow:visible}
.psy .rg{cursor:help}
.psy .rg:hover{filter:brightness(1.07) saturate(1.1)}
.psy-mini{width:36px}
.psy-mid{width:62px}
.psy-big{width:196px;margin:0 auto}
.psy-l{pointer-events:none}
.psy-cs{font:600 6.4px var(--sans);fill:var(--ink)}
.psy-ego{font:600 12px var(--sans);fill:var(--ink)}
.psy-id{font:600 14px var(--sans);fill:var(--paper)}
.psy-sup{font:600 7.2px var(--sans);fill:#1E2744}
.psy-rep{font:italic 6.6px var(--serif);fill:var(--madder)}
.strip5{display:block;height:auto}
.strip5 g{cursor:help}
.strip5-mini{width:136px}
.strip5-big{width:100%;max-width:236px;margin:12px auto 0}
.psy-st{font:6.8px var(--sans);fill:var(--ink-2)}
.psy-adult{font:italic 8px var(--serif);fill:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;margin:0 4px 0 2px;vertical-align:-1px}
.sw.id{background:#9C2A24}.sw.sup{background:#4E66AE}.sw.ego{background:#E8E1CC;box-shadow:inset 0 0 0 1px #1B1511}
.wk-mini{cursor:help;white-space:nowrap}

/* wheel agencies */
#wheel.psyche .gondola.ag-id .cabin{fill:#9C2A24}
#wheel.psyche .gondola.ag-sup .cabin{fill:#4E66AE}
#wheel.psyche .gondola.ag-sup .gnum{fill:var(--paper)}
#wheel.psyche .gondola.ag-ego .cabin{fill:var(--bone)}
#wheel.psyche .gondola.ag-ego .gnum{fill:var(--ink)}
#wheel.psyche .gondola.ag-ego .win{fill:#B9B09A}
#wheel .gondola.won .cabin{fill:var(--gold)}
#wheel .gondola.won .gnum{fill:#000}
.wheel-key{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;min-height:26px}
.wk{display:inline-flex;align-items:center;gap:6px;font:14px var(--sans);color:var(--bone);padding:4px 9px 2px;border:1px solid rgba(232,200,114,.4);cursor:help}
.wk i{width:12px;height:12px;display:inline-block;margin-top:-2px}
.wk-id i{background:#9C2A24;box-shadow:0 0 0 1px #E8C872}
.wk-sup i{background:#4E66AE;box-shadow:0 0 0 1px #E8C872}
.wk-ego i{background:#E8E1CC;box-shadow:0 0 0 1px #E8C872}
.ego-choice{margin-top:10px;padding:10px 12px 12px;background:rgba(232,225,204,.1);border:1px solid rgba(232,200,114,.5)}
.ego-choice p{margin:0 0 8px;font-size:14.5px;color:var(--bone)}
.ego-opts{display:flex;gap:6px}
.ego-opts .btn{flex:1;font-size:15px;padding:8px 6px 6px}
.ego-opts .btn small{font-size:12.5px}
.space.preview .halo{opacity:1}
.space.preview > circle:nth-of-type(2), .space.preview > rect{stroke:var(--gold-hi);stroke-width:5}

/* global tooltip */
.tipg{position:fixed;z-index:60;max-width:330px;background:var(--paper);color:var(--ink);border:2px solid #000;padding:8px 11px 9px;
  font:14px/1.42 var(--serif);box-shadow:0 10px 24px rgba(0,0,0,.3);pointer-events:none;white-space:pre-line}
.tipg[hidden]{display:none}

/* notebook */
.notebook .card-in{padding:20px 30px 18px}
.tab-gap{flex:1}
.tab-note{font-style:italic;color:var(--ink-2);padding:9px 6px}
.nb-body{max-height:min(72vh,820px);overflow:auto;padding:14px 4px 4px 0}
.nb-grid{display:grid;grid-template-columns:236px minmax(0,1fr);gap:30px}
.nb-grid.board{grid-template-columns:250px minmax(0,1fr)}
.nb-left{position:sticky;top:0;align-self:start}
.nb-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:14px 0 8px;font-size:14.5px}
.nb-kv dt{font:13.5px var(--sans);color:var(--ink-2);padding-top:2px}
.nb-kv dd{margin:0}
.nb-hint{font-style:italic;font-size:13.5px;color:var(--ink-2);margin:6px 0 0}
.nb-empty{font-size:17px;font-style:italic;color:var(--ink-2);max-width:60ch}
.nb-who{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.nb-who strong{display:block;font:600 22px var(--sans);padding-top:3px}
.nb-who span{display:block;font-style:italic;color:var(--ink-2);font-size:14.5px}

.nb-sec p{margin:0 0 6px;font-size:16px;line-height:1.6;max-width:74ch}
.nb-lead{font-size:17px;line-height:1.62;max-width:72ch;margin:4px 0 8px}
.nb-q{margin:0;padding-left:20px;font-size:16px;line-height:1.55}
.nb-q li{margin:0 0 5px}
.nb-q b{font:600 15px var(--sans)}
.nb-notes{list-style:none;padding:0;margin:0}
.nb-notes li{padding:6px 0;border-bottom:1px dotted var(--bone-2);font-size:15px;line-height:1.45}
.nt{font:600 13px var(--sans);color:var(--ink-2);margin-right:6px}
.ctag{font:12.5px var(--sans);border:1px solid var(--gold);padding:2px 5px 0;margin-left:6px;color:var(--gold-lo);cursor:help;white-space:nowrap}
.nb-list{max-height:min(66vh,760px);overflow:auto;padding-right:8px;border-right:2px solid #000}
.nb-list h4{font:600 13.5px var(--sans);color:var(--ink-2);margin:12px 0 4px}

.nb-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 6px 3px;cursor:pointer;text-align:left;font:14.5px var(--serif);color:var(--ink)}
.nb-item:hover{background:var(--paper)}

.nb-space-head{display:flex;align-items:center;gap:12px}
.nb-space-head .btn{margin-left:auto;flex:none}
.nb-title{font:600 26px/1.15 var(--sans);margin:2px 0 4px;padding-top:3px}
.nb-title em{font:italic 400 18px var(--serif);color:var(--ink-2)}
.nb-idea h4{font:600 16px var(--sans);margin:8px 0 0}
.nb-idea h4 em{font:italic 400 14px var(--serif);color:var(--ink-2)}
.nb-context{border-left:3px solid var(--gold);padding-left:10px;font-size:15.5px;max-width:72ch}
.rk-egg{line-height:0}
.rk-nb{margin-left:auto;font-size:14px;padding:8px 11px 6px}
.rk-nb + .rk-total{margin-left:16px}
@media (max-width:900px){
  .nb-grid,.nb-grid.board{grid-template-columns:1fr}
  .nb-left{position:static}
  .nb-list{max-height:220px;border-right:0;border-bottom:2px solid #000}
}

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div id="brandTitle"></div>
      <p class="tagline">A Freudian game of life, after Milton Bradley</p>
    </div>
    <nav class="nav" aria-label="Game menu">
      <button class="link" id="btnRules">How to play</button>
      <button class="link" id="btnNotebook">Notebook</button>
      <button class="link" id="btnCodex">Codex</button>
      <button class="link" id="btnSound" aria-pressed="true">Sound on</button>
      <button class="link" id="btnNew">New game</button>
    </nav>
  </header>

  <main class="board-col">
    <div class="board-frame">
      <svg id="board" viewBox="0 0 1600 1000" role="img" aria-label="The board: a road from birth to the Day of Reckoning"></svg>
      <div id="toasts" aria-hidden="true"></div>
      <div id="tip" class="tip" hidden></div>
    </div>
    <div class="board-tools">
      <div class="legend" id="legend" aria-label="Key to the spaces"></div>
      <div class="zoom" aria-label="Zoom the board">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomFit">Fit</button>
      </div>
    </div>
  </main>

  <aside class="side" aria-label="Turn and ledger">
    <section class="turnbox" id="turnBox">
      <div id="turnMedal"></div>
      <div><div class="turn-name" id="turnName">Welcome</div><div class="turn-sub" id="turnSub">Choose a case to begin</div></div>
    </section>
    <section class="wheelbox">
      <p class="wheel-cap">Riesenrad<em>the wheel of fate</em></p>
      <svg id="wheel" viewBox="0 0 320 326" aria-hidden="true"></svg>
      <div class="spin-row">
        <button id="spinBtn" class="btn primary big" disabled>Spin the wheel</button>
        <output id="spinOut" aria-live="polite" aria-label="Last spin"></output>
      </div>
      <div id="egoChoice" class="ego-choice" hidden></div>
      <div id="wheelKey" class="wheel-key" aria-label="Which agency holds which gondolas"></div>
      <p id="spinHint" class="hint"></p>
    </section>
    <section class="ledger" id="ledger"></section>
    <section class="notes">
      <h3>Case notes</h3>
      <ol id="log" aria-live="polite"></ol>
    </section>
  </aside>

  <footer class="strip" id="strip" aria-label="Players"></footer>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="overlay2" class="overlay top" hidden></div>
<script>

    const [p0, p1, p2, p3] = [P[i], P[i + 1], P[i + 2], P[i + 3]];
    for (let s = 0; s < per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }

}
function resample(poly, n) {
  const d = [0];
  for (let i = 1; i < poly.length; i++) d.push(d[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const L = d[d.length - 1], res = [];
  let j = 1;
  for (let k = 0; k < n; k++) {
    const target = n === 1 ? L / 2 : L * k / (n - 1);
    while (j < d.length - 1 && d[j] < target) j++;
    const seg = d[j] - d[j - 1] || 1, u = (target - d[j - 1]) / seg;
    res.push([poly[j - 1][0] + (poly[j][0] - poly[j - 1][0]) * u, poly[j - 1][1] + (poly[j][1] - poly[j - 1][1]) * u]);
  }
  return { pts: res, length: L };
}
function smoothPath(pts) {
  if (pts.length < 2) return "";
  const P = [pts[0], ...pts, pts[pts.length - 1]];
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

/* ---------- graph ---------- */
function buildGraph() {
  const byId = {};
  SPACES.forEach(s => {
    const base = TYPE_TEXT[s.type] || {};
    byId[s.id] = Object.assign({ title: base.title, de: base.de, text: base.text, src: base.src }, s, { next: [] });
  });
  const segOf = {};
  SEGS.forEach(seg => {
    const dense = catmullDense(seg.pts);
    const { pts, length } = resample(dense, seg.ids.length);
    seg.spacing = length / Math.max(1, seg.ids.length - 1);
    seg.ids.forEach((id, i) => {
      const n = byId[id];
      if (!n) throw new Error("Missing space " + id);
      n.x = pts[i][0]; n.y = pts[i][1]; n.seg = seg.id; segOf[id] = seg.id;
      if (i < seg.ids.length - 1) n.next.push(seg.ids[i + 1]);
    });
  });
  // links between segments
  const link = (a, b) => { if (!byId[a].next.includes(b)) byId[a].next.push(b); };
  SEGS.forEach(seg => {
    if (seg.from) link(seg.from, seg.ids[0]);
    if (seg.to) link(seg.ids[seg.ids.length - 1], seg.to);
  });
  link("c_war", "d_infl");
  Object.entries(END_POS).forEach(([id, p]) => { byId[id].x = p[0]; byId[id].y = p[1]; byId[id].seg = "END"; });
  // branch lookup for forks
  byId.crossroads.branches = { dissolve: "a1_heir", repress: "a2_push" };
  byId.matura.branches = { uni: "b1_brentano", work: "b2_apprentice" };
  byId.d_fork.branches = { berggasse: "d1_couch1", ring: "d2_pay" };
  return byId;
}

/* Chains for drawing the road */
function roadChains(G) {
  const ids = s => SEGS.find(x => x.id === s).ids;
  const chain = arr => arr.map(id => [G[id].x, G[id].y]);
  return [
    { k: "A",  pts: chain(ids("A")) },
    { k: "A1", pts: chain(["crossroads", ...ids("A1"), "school"]) },
    { k: "A2", pts: chain(["crossroads", ...ids("A2"), "school"]) },
    { k: "B",  pts: chain(ids("B")) },
    { k: "B1", pts: chain(["matura", ...ids("B1"), "c_pay1"]) },
    { k: "B2", pts: chain(["matura", ...ids("B2"), "c_pay1"]) },
    { k: "C",  pts: chain(ids("C")) },
    { k: "D",  pts: chain(["c_war", ...ids("D")]) },
    { k: "D1", pts: chain(["d_fork", ...ids("D1"), "e_pay"]) },
    { k: "D2", pts: chain(["d_fork", ...ids("D2"), "e_pay"]), ring: true },
    { k: "E",  pts: chain(ids("E")) }
  ];
}

};
function styleFor(n) {
  const s = Object.assign({}, TYPE_STYLE[n.type] || TYPE_STYLE.plain);
  if (n.icon) s.icon = n.icon;
  if (n.type === "anxiety" && n.kind === "moral") s.icon = "eye";

}

function carriageSVG(p, big = false) {
  const col = p.color, dark = p.dark;
  const pegs = [];
  const slots = [[-17, -21], [-11.5, -21], [-6, -21], [-17, -15.5], [-11.5, -15.5], [-6, -15.5]];
  const riders = [];
  if (p.object) riders.push(p.object.type === "narcissistic" ? "#E8C872" : "#F3EFE2");
  for (let i = 0; i < p.children.length && riders.length < 6; i++) riders.push(i % 2 ? "#B9C7D6" : "#E6B8B0");
  riders.forEach((c, i) => pegs.push(`<circle cx="${slots[i][0]}" cy="${slots[i][1]}" r="2.4" fill="${c}" stroke="#1B1511" stroke-width=".8"/>`));
  return `<g class="carriage">
    <ellipse cx="4" cy="10.5" rx="36" ry="3.2" fill="#000" opacity=".16"/>
    ${horse(24, 1, true)}${horse(28, 3.4, false)}
    <path d="M6 -2 L20 -2" stroke="#1B1511" stroke-width="1.4"/>
    <path d="M-25 2 V-8 Q-24 -12 -18 -12 H0 Q5 -12 7 -7 L8 2 Z" fill="${col}" stroke="#1B1511" stroke-width="1.3"/>
    <path d="M-25 -8 Q-26 -24 -8 -24 L-4 -12 H-18 Q-24 -12 -25 -8 Z" fill="${dark}" stroke="#1B1511" stroke-width="1.1"/>
    <path d="M-22 -2 H4" stroke="#E8C872" stroke-width="1.3"/>

    <circle cx="9.5" cy="-20.5" r="3.6" fill="${dark}" stroke="#E8C872" stroke-width="1.3"/>
    ${pegs.join("")}
    <g><circle cx="-17" cy="5.5" r="7" fill="none" stroke="#1B1511" stroke-width="1.7"/>
      <path d="M-17 -1.5 V12.5 M-24 5.5 H-10 M-22 0.5 L-12 10.5 M-22 10.5 L-12 0.5" stroke="#1B1511" stroke-width=".8"/>
      <circle cx="-17" cy="5.5" r="1.4" fill="${dark}"/></g>

/* ---------- Board renderer ---------- */
const Board = {
  G: null, svg: null, tokens: {}, vb: { x: 0, y: 0, w: 1600, h: 1000 },
  init(svg) {
    this.svg = svg;
    this.G = buildGraph();
    this.render();
    this.bindZoom();
  },
  render() {
    const G = this.G;
    const chains = roadChains(G);
    const defs = `<defs>
      <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .08 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="${C.goldLo}" opacity=".22"/></pattern>
      <radialGradient id="glow"><stop offset="0" stop-color="${C.goldHi}" stop-opacity=".95"/><stop offset="1" stop-color="${C.goldHi}" stop-opacity="0"/></radialGradient>
      ${Object.entries(ICONS).map(([k, v]) => `<symbol id="ic-${k}" viewBox="0 0 24 24">${v}</symbol>`).join("")}
    </defs>`;
    const bg = `<rect x="0" y="0" width="1600" height="1000" fill="${C.bone}"/>
      <rect x="0" y="0" width="1600" height="1000" fill="url(#dots)"/>
      <rect x="0" y="0" width="1600" height="1000" filter="url(#paper)" opacity=".9"/>
      <rect x="0" y="0" width="1600" height="232" fill="${C.goldHi}" opacity=".07"/>
      <rect x="0" y="780" width="1600" height="220" fill="${C.madder}" opacity=".05"/>`;

    // road
    let road = "";
    chains.forEach(ch => {
      const d = smoothPath(ch.pts);
      road += `<path d="${d}" class="road-edge"/>`;
    });
    chains.forEach(ch => {
      const d = smoothPath(ch.pts);
      road += `<path d="${d}" class="road"/>`;
      if (ch.ring) road += `<path d="${d}" class="road-ring"/>`;
    });
    // end connectors
    ["endCommon", "endImmortal", "endInterminable"].forEach(id => {
      road += `<path d="M${G.reckoning.x} ${G.reckoning.y} L${G[id].x} ${G[id].y}" class="road-end"/>`;
    });

    // spaces
    let spaces = "";
    Object.values(G).forEach(n => {
      const s = styleFor(n);
      const r = s.diamond ? 25 : 19;
      const shape = s.diamond
        ? `<rect x="${-r * 0.78}" y="${-r * 0.78}" width="${r * 1.56}" height="${r * 1.56}" transform="rotate(45)" fill="${s.fill}" stroke="${s.ring}" stroke-width="3"/>`
        : `<circle r="${r}" fill="${s.fill}" stroke="${s.ring}" stroke-width="${s.dashed ? 2.6 : 2}" ${s.dashed ? 'stroke-dasharray="5 3.2"' : ""}/>` + (s.dashed ? `<circle r="${r - 4.5}" fill="none" stroke="${s.ring}" stroke-width="1" opacity=".6"/>` : "");
      const isz = s.diamond ? 24 : 22;
      spaces += `<g class="space" data-id="${n.id}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})" tabindex="-1">
        <circle r="${r + 8}" class="halo" fill="url(#glow)" opacity="0"/>
        ${shape}
        <use href="#ic-${s.icon}" x="${-isz / 2}" y="${-isz / 2}" width="${isz}" height="${isz}" style="color:${s.ic}"/>
      </g>`;
    });
    // labels
    let labels = "";
    Object.entries(LABELS).forEach(([id, L]) => {
      const n = G[id];
      labels += `<text x="${(n.x + L.dx).toFixed(1)}" y="${(n.y + L.dy).toFixed(1)}" text-anchor="${L.a}" class="stop-label">${L.text || n.title}</text>`;
    });

    this.svg.innerHTML = defs + bg + `<g id="scenery">${scenery()}</g><g id="roads">${road}</g><g id="spaces">${spaces}</g><g id="labels">${labels}</g><g id="tokens"></g><g id="fx"></g>`;
    this.tokenLayer = this.svg.querySelector("#tokens");
    this.fxLayer = this.svg.querySelector("#fx");
    this.bindTips();
  },
  bindTips() {
    const tip = document.getElementById("tip");
    if (!tip) return;
    const frame = this.svg.parentElement;
    const show = (el) => {
      const n = this.G[el.dataset.id];
      tip.innerHTML = `<strong>${n.title || ""}</strong>${n.de && n.de !== n.title ? ` <em>${n.de}</em>` : ""}<span>${n.text || ""}</span>`;
      tip.hidden = false;
      const pr = frame.getBoundingClientRect(), er = el.getBoundingClientRect();
      let left = er.left - pr.left + er.width / 2 - 140, top = er.top - pr.top - 12;
      left = Math.max(8, Math.min(pr.width - 288, left));
      tip.style.left = left + "px";
      tip.style.top = top + "px";
      tip.classList.toggle("below", top < 140);
      if (top < 140) tip.style.top = (er.bottom - pr.top + 12) + "px";
    };
    this.svg.querySelectorAll(".space").forEach(el => {
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("mouseleave", () => { tip.hidden = true; });
      el.addEventListener("click", () => {
        if (this.dragMoved) return;
        tip.hidden = true;
        if (typeof Notebook !== "undefined") Notebook.open({ space: el.dataset.id });
      });
    });
  },
  /* tokens */
  placeTokens(players, animatingId) {
    players.forEach(p => {
      if (!this.tokens[p.id]) {
        const g = document.createElementNS(SVGNS, "g");
        g.setAttribute("class", "token");
        g.dataset.pid = p.id;
        this.tokenLayer.appendChild(g);
        this.tokens[p.id] = { g, x: 0, y: 0, face: 1 };
      }
      this.tokens[p.id].g.innerHTML = `<g class="flip">${carriageSVG(p)}</g>`;
    });
    this.layout(players, animatingId);
  },
  offsetsFor(players, p) {
    const same = players.filter(q => q.pos === p.pos);
    const k = same.indexOf(p);
    const offs = [[0, -14], [-26, 8], [28, 10], [0, 30]];
    return offs[Math.max(0, k)] || [0, 0];
  },
  layout(players, animatingId) {
    players.forEach(p => {
      if (p.id === animatingId) return;
      const n = this.G[p.pos], [ox, oy] = this.offsetsFor(players, p);
      this.setToken(p, n.x + ox, n.y + oy);
    });
    // bring current to front
  },
  setToken(p, x, y, face) {
    const t = this.tokens[p.id];
    if (!t) return;
    if (face) t.face = face;
    t.x = x; t.y = y;
    t.g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    t.g.querySelector(".flip").setAttribute("transform", `scale(${t.face * 1.3},1.3)`);
  },
  front(p) { const t = this.tokens[p.id]; if (t) this.tokenLayer.appendChild(t.g); },
  async stepToken(p, fromId, toId, ms) {
    const a = this.G[fromId], b = this.G[toId], t = this.tokens[p.id];
    if (!t) return;
    const face = b.x < a.x - 2 ? -1 : (b.x > a.x + 2 ? 1 : t.face);
    const sx = t.x, sy = t.y, ex = b.x, ey = b.y - 14;
    if (!ms) { this.setToken(p, ex, ey, face); return; }
    await new Promise(res => {
      const t0 = performance.now();
      const tick = now => {
        const u = Math.min(1, (now - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        const hop = Math.sin(u * Math.PI) * 7;
        this.setToken(p, sx + (ex - sx) * e, sy + (ey - sy) * e - hop, face);
        if (u < 1) requestAnimationFrame(tick); else res();
      };
      requestAnimationFrame(tick);
    });
  },
  pulse(id, color) {
    const el = this.svg.querySelector(`.space[data-id="${id}"] .halo`);
    if (!el) return;
    el.style.transition = "none"; el.setAttribute("opacity", "1");
    requestAnimationFrame(() => { el.style.transition = "opacity 1.4s ease"; el.setAttribute("opacity", "0"); });
  },
  markPreview(id) {
    this.svg.querySelectorAll(".space.preview").forEach(e => e.classList.remove("preview"));
    if (!id) return;
    const el = this.svg.querySelector(`.space[data-id="${id}"]`);
    if (el) el.classList.add("preview");
  },
  markCurrent(id) {
    this.svg.querySelectorAll(".space.current").forEach(e => e.classList.remove("current"));
    const el = this.svg.querySelector(`.space[data-id="${id}"]`);
    if (el) el.classList.add("current");
  },
  /* zoom & pan */
  applyVB() {
    const v = this.vb;
    this.svg.setAttribute("viewBox", `${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`);
    this.svg.classList.toggle("zoomed", v.w < 1599);
  },
  clampVB() {
    const v = this.vb;
    v.w = Math.min(1600, Math.max(480, v.w)); v.h = v.w * 1000 / 1600;
    v.x = Math.min(1600 - v.w, Math.max(0, v.x)); v.y = Math.min(1000 - v.h, Math.max(0, v.y));
  },
  zoom(f, cx, cy) {
    const v = this.vb;
    if (cx === undefined) { cx = v.x + v.w / 2; cy = v.y + v.h / 2; }
    const nw = v.w * f;
    v.x = cx - (cx - v.x) * (nw / v.w); v.y = cy - (cy - v.y) * (nw / v.w);
    v.w = nw; this.clampVB(); this.applyVB();
  },
  fit() {
    this.vb = { x: 0, y: 0, w: 1600, h: 1000 }; this.applyVB();
    if (this.svg.clientWidth && this.svg.clientWidth < 700 && !this.userFit) this.zoom(0.5, 100, 900);
  },
  follow(p) {
    if (this.vb.w >= 1599) return;
    const n = this.G[p.pos], v = this.vb, m = v.w * 0.18;
    if (n.x < v.x + m || n.x > v.x + v.w - m || n.y < v.y + m || n.y > v.y + v.h - m) {
      v.x = n.x - v.w / 2; v.y = n.y - v.h / 2; this.clampVB(); this.applyVB();
    }
  },
  bindZoom() {
    const svg = this.svg;
    const toBoard = (e) => {
      const r = svg.getBoundingClientRect(), v = this.vb;
      const scale = Math.max(v.w / r.width, v.h / r.height);
      const offX = (r.width - v.w / scale) / 2, offY = (r.height - v.h / scale) / 2;
      return [v.x + (e.clientX - r.left - offX) * scale, v.y + (e.clientY - r.top - offY) * scale];
    };
    svg.addEventListener("wheel", e => {
      if (!e.ctrlKey && !e.metaKey && this.vb.w >= 1599 && e.deltaY > 0) return;
      e.preventDefault();
      const [bx, by] = toBoard(e);
      this.zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, bx, by);
    }, { passive: false });
    let drag = null;
    svg.addEventListener("pointerdown", e => {
      if (this.vb.w >= 1599 || e.button > 0) return;
      drag = { x: e.clientX, y: e.clientY, vx: this.vb.x, vy: this.vb.y };
      this.dragMoved = false;
      svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
    });
    svg.addEventListener("pointermove", e => {
      if (!drag) return;
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) this.dragMoved = true;
      if (!this.dragMoved) return;
      const r = svg.getBoundingClientRect(), scale = Math.max(this.vb.w / r.width, this.vb.h / r.height);
      this.vb.x = drag.vx - (e.clientX - drag.x) * scale; this.vb.y = drag.vy - (e.clientY - drag.y) * scale;
      this.clampVB(); this.applyVB();
    });
    const end = () => { drag = null; svg.classList.remove("dragging"); setTimeout(() => { this.dragMoved = false; }, 0); };
    svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  }
};

   ===================================================================== */
const Sound = {
  ctx: null, on: true,
  ensure() {
    if (!this.on || (typeof UI !== "undefined" && UI.speed === "instant")) return null;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type = "sine", vol = 0.08, when = 0) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  click() { this.tone(2100, 0.035, "square", 0.025); },
  step() { this.tone(420 + Math.random() * 60, 0.05, "triangle", 0.03); },
  coin() { this.tone(988, 0.12, "sine", 0.07); this.tone(1319, 0.22, "sine", 0.06, 0.09); },
  bad() { this.tone(196, 0.28, "sawtooth", 0.035); this.tone(147, 0.36, "sawtooth", 0.03, 0.12); },
  good() { this.tone(523, 0.12, "sine", 0.06); this.tone(659, 0.12, "sine", 0.06, 0.1); this.tone(784, 0.24, "sine", 0.06, 0.2); },
  card() { this.tone(660, 0.06, "triangle", 0.04); }
};

/* =====================================================================
   WHEEL — the Prater Riesenrad (1897) as Milton Bradley's Wheel of Fate
   ===================================================================== */
const Wheel = {
  svg: null, phi: 0, gondolas: [], spinning: false, cx: 160, cy: 148, R: 116,
  init(svg) {
    this.svg = svg;
    const { cx, cy, R } = this;
    let rimTruss = "";
    for (let i = 0; i < 60; i++) {
      const a1 = (i * 6) * Math.PI / 180, a2 = (i * 6 + 6) * Math.PI / 180;
      rimTruss += `<line x1="${(cx + (R - 9) * Math.cos(a1)).toFixed(1)}" y1="${(cy + (R - 9) * Math.sin(a1)).toFixed(1)}" x2="${(cx + R * Math.cos(a2)).toFixed(1)}" y2="${(cy + R * Math.sin(a2)).toFixed(1)}"/>`;
    }
    let spokes = "";
    for (let i = 0; i < 20; i++) {
      const a = (i * 18) * Math.PI / 180, b = (i * 18 + 9) * Math.PI / 180;
      spokes += `<line x1="${(cx + 13 * Math.cos(a)).toFixed(1)}" y1="${(cy + 13 * Math.sin(a)).toFixed(1)}" x2="${(cx + (R - 9) * Math.cos(b)).toFixed(1)}" y2="${(cy + (R - 9) * Math.sin(b)).toFixed(1)}"/>`;
    }
    let lights = "";
    for (let i = 0; i < 40; i++) {
      const a = (i * 9 + 4.5) * Math.PI / 180;
      lights += `<circle cx="${(cx + (R - 4.5) * Math.cos(a)).toFixed(1)}" cy="${(cy + (R - 4.5) * Math.sin(a)).toFixed(1)}" r="1.3"/>`;
    }
    let gond = "";
    for (let i = 0; i < 10; i++) {
      gond += `<g class="gondola" data-n="${i + 1}">
        <line x1="0" y1="0" x2="0" y2="5" class="hanger"/>
        <path d="M-16 8 Q-16 5 -13 5 H13 Q16 5 16 8 V29 H-16 Z" class="cabin"/>
        <rect x="-13" y="8.5" width="26" height="5" class="win"/>
        <rect x="-17" y="28" width="34" height="3" class="sill"/>
        <text x="0" y="26" class="gnum">${i + 1}</text>
        <circle r="2.6" class="pivot"/>
      </g>`;
    }
    svg.innerHTML = `
      <defs><radialGradient id="wglow"><stop offset="0" stop-color="#E8C872" stop-opacity=".5"/><stop offset="1" stop-color="#E8C872" stop-opacity="0"/></radialGradient></defs>
      <g class="frame">
        <line x1="${cx}" y1="${cy}" x2="${cx - 88}" y2="316"/><line x1="${cx}" y1="${cy}" x2="${cx + 88}" y2="316"/>
        <line x1="${cx}" y1="${cy}" x2="${cx - 40}" y2="316"/><line x1="${cx}" y1="${cy}" x2="${cx + 40}" y2="316"/>
        <line x1="${cx - 62}" y1="266" x2="${cx + 62}" y2="266"/><line x1="${cx - 74}" y1="292" x2="${cx + 74}" y2="292"/>
        <path d="M${cx - 62} 266 L${cx - 40} 316 M${cx + 62} 266 L${cx + 40} 316 M${cx - 74} 292 L${cx - 20} 266 M${cx + 74} 292 L${cx + 20} 266"/>
        <rect x="${cx - 120}" y="316" width="240" height="6" class="ground"/>
      </g>
      <g class="rot">
        <circle cx="${cx}" cy="${cy}" r="${R}" class="rim"/>
        <circle cx="${cx}" cy="${cy}" r="${R - 9}" class="rim2"/>
        <g class="truss">${rimTruss}</g>
        <g class="spokes">${spokes}</g>
        <g class="lights">${lights}</g>
      </g>
      <circle cx="${cx}" cy="${cy}" r="15" class="hub"/><circle cx="${cx}" cy="${cy}" r="6" class="hub2"/>
      <g class="gondolas">${gond}</g>
      <circle class="winglow" r="30" fill="url(#wglow)" opacity="0"/>
      <path d="M${cx - 9} 2 H${cx + 9} L${cx} 18 Z" class="pointer"/>
    `;
    this.rot = svg.querySelector(".rot");
    this.gondolas = [...svg.querySelectorAll(".gondola")];
    this.glow = svg.querySelector(".winglow");
    this.draw();
  },
  draw() {
    const { cx, cy, R } = this;
    this.rot.setAttribute("transform", `rotate(${this.phi.toFixed(2)} ${cx} ${cy})`);
    this.gondolas.forEach((g, i) => {
      const a = (-90 + i * 36 + this.phi) * Math.PI / 180;
      g.setAttribute("transform", `translate(${(cx + R * Math.cos(a)).toFixed(1)},${(cy + R * Math.sin(a)).toFixed(1)})`);
    });
  },
  topIndex() {
    // gondola whose angle is nearest to -90
    let best = 0, bd = 1e9;
    for (let i = 0; i < 10; i++) {
      let a = ((-90 + i * 36 + this.phi) % 360 + 360) % 360; // 0..360, top = 270
      const d = Math.abs(a - 270);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  },
  setAgencies(map) {
    this.gondolas.forEach(g => {
      const n = +g.dataset.n, ag = map ? map[n] : null;
      g.classList.remove("ag-id", "ag-sup", "ag-ego");
      if (ag) g.classList.add("ag-" + ag);
    });
    this.svg.classList.toggle("psyche", !!map);
  },
  highlight(k) {
    this.gondolas.forEach(g => g.classList.toggle("won", +g.dataset.n === k));
    if (k) {
      const a = (-90 + (k - 1) * 36 + this.phi) * Math.PI / 180;
      this.glow.setAttribute("cx", this.cx + this.R * Math.cos(a));
      this.glow.setAttribute("cy", this.cy + this.R * Math.sin(a) + 14);
      this.glow.setAttribute("opacity", "1");
    } else this.glow.setAttribute("opacity", "0");
  },
  spin(k, ms = 2800) {
    this.highlight(0);
    const base = ((-(k - 1) * 36) % 360 + 360) % 360;
    const cur = ((this.phi % 360) + 360) % 360;
    let delta = base - cur; if (delta < 0) delta += 360;
    const turns = ms > 1200 ? 2 + Math.floor(Math.random() * 2) : (ms > 0 ? 1 : 0);
    const jitter = ms > 0 ? (Math.random() * 10 - 5) : 0;
    const start = this.phi, end = this.phi + delta + 360 * turns + jitter;
    if (!ms) { this.phi = end; this.draw(); this.highlight(k); return Promise.resolve(k); }
    this.spinning = true;
    let lastIdx = this.topIndex();
    return new Promise(res => {
      const t0 = performance.now();
      const tick = now => {
        const u = Math.min(1, (now - t0) / ms);
        const e = 1 - Math.pow(1 - u, 4);
        this.phi = start + (end - start) * e;
        this.draw();
        const ti = this.topIndex();
        if (ti !== lastIdx) { lastIdx = ti; Sound.click(); }
        if (u < 1) requestAnimationFrame(tick);
        else { this.spinning = false; this.highlight(k); res(k); }
      };
      requestAnimationFrame(tick);
    });
  }
};

function titleSVG(text = "DAS SPIEL DES LEBENS", opts = {}) {
  const gap = 9, wordGap = 44;
  let x = 0, paths = "", orns = "";
  const words = text.split(" ");
  words.forEach((w, wi) => {
    [...w].forEach((ch, ci) => {
      const g = GLYPHS[ch];
      paths += `<path d="${g.d}" transform="translate(${x},0)"/>`;
      x += g.w + (ci < w.length - 1 ? gap : 0);
    });
    if (wi < words.length - 1) {
      const ox = x + wordGap / 2;
      orns += `<rect x="${ox - 4}" y="22" width="8" height="8"/><rect x="${ox - 4}" y="46" width="8" height="8"/><rect x="${ox - 4}" y="70" width="8" height="8"/>`;
      x += wordGap;
    }
  });
  const W = x;
  let checks = "";
  for (let i = 0, cx = 0; cx < W; i++, cx += 12) {
    checks += `<rect x="${cx}" y="-22" width="6" height="6"/><rect x="${cx + 6}" y="-16" width="6" height="6"/>`;
    checks += `<rect x="${cx}" y="116" width="6" height="6"/><rect x="${cx + 6}" y="122" width="6" height="6"/>`;
  }
  return `<svg class="title-art" viewBox="-8 -30 ${W + 16} 160" role="img" aria-label="Das Spiel des Lebens" ${opts.h ? `style="height:${opts.h}px"` : ""}>
    <g class="t-checks">${checks}</g>
    <g class="t-glyphs">${paths}</g>
    <g class="t-orns">${orns}</g>
  </svg>`;
}

/* ---------- chips ---------- */
function chipsFor(eff = {}, pen = {}, p) {
  const out = [];
  const add = (t, tone) => out.push({ t, tone });
  const v = (o, k) => o && o[k];
  if (v(eff, "kronen") > 0) add("+" + fmtK(eff.kronen), "good");
  if (v(pen, "kronen") < 0) add(fmtK(pen.kronen), "bad");
  if (v(eff, "kronen") < 0) add(fmtK(eff.kronen), "bad");
  if (v(eff, "libido") > 0) add(`+${eff.libido} libido`, "good");
  if (v(eff, "libido") < 0) add(`${eff.libido} libido`, "bad");
  if (v(pen, "libido") < 0) add(`${pen.libido} libido`, "bad");
  if (v(eff, "guilt") < 0) add(`${eff.guilt} guilt`, "good");
  if (v(eff, "guilt") > 0) add(`+${eff.guilt} guilt`, "bad");
  if (v(pen, "guilt")) add(`+${pen.guilt === "severity" ? (p ? Math.max(1, p.severity) : "severity") : pen.guilt} guilt`, "bad");
  if (v(pen, "symptom")) add(`Symptom: ${pen.symptom}`, "bad");
  if (v(pen, "skip")) add("Miss a turn", "bad");
  if (v(pen, "back")) add(`Back ${pen.back} spaces`, "bad");
  if (v(eff, "forward")) add(`Forward ${eff.forward}`, "good");
  return out;
}

      `<span class="wk wk-${k}" tabindex="0" data-tip="${esc(tip)}"><i></i>${AGENCY[k].name} ${n}</span>`).join("");
  },
  egoChoose(p, r, opts) {

  log(p, html) {

  toast(p, title, lines = [], tone = "") {
    if (this.speed === "instant") return;
    const box = $("#toasts");
    const d = document.createElement("div");
    d.className = "toast " + tone;

  /* ---------- modal card ---------- */
  card(spec) {
    const p = spec.p;
    const isAI = p && !p.human;
    const aiVal = typeof spec.ai === "function" ? spec.ai() : spec.ai;
    const choices = spec.choices && spec.choices.length ? spec.choices : [{ label: "Continue", value: true, primary: true }];
    const fallback = aiVal !== undefined ? aiVal : (choices.find(c => c.primary && !c.disabled) || choices.find(c => !c.disabled)).value;
    if (isAI && this.speed !== "normal") return Promise.resolve(fallback);
    Sound.card();
    return new Promise(resolve => {
      const ov = $("#overlay");
      const chips = (spec.chips || []).map(c => `<span class="chip ${c.tone || ""}">${esc(c.t)}</span>`).join("");
      ov.innerHTML = `<div class="card ${spec.kind || ""} ${spec.wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="cardTitle" style="--pc:${p ? p.color : "#C9A13B"}">
        <div class="card-in">
          <div class="card-top">
            ${spec.icon ? `<span class="card-ic" style="background:${spec.iconBg || "#0B0A09"};color:${spec.iconColor || "#E8C872"}">${iconSVG(spec.icon, 26)}</span>` : ""}
            <span class="kicker">${esc(spec.kicker || "")}</span>
            ${p ? `<span class="who">${medalSVG(p, 28)}${esc(p.name)}</span>` : ""}
          </div>
          <h2 id="cardTitle">${esc(spec.title || "")}${spec.de && spec.de !== spec.title ? ` <em>${esc(spec.de)}</em>` : ""}</h2>
          ${spec.text ? `<p class="card-text">${spec.text}</p>` : ""}
          ${spec.note ? `<p class="card-note">${spec.note}</p>` : ""}
          ${spec.extra || ""}
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${spec.src ? `<p class="card-src">${esc(spec.src)}</p>` : ""}
          <div class="card-actions">${choices.map((c, i) => `<button class="btn ${c.primary ? "primary" : ""}" data-i="${i}" ${c.disabled ? "disabled" : ""} ${c.hint ? `title="${esc(c.hint)}"` : ""}>${esc(c.label)}${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</button>`).join("")}</div>
          ${isAI ? `<p class="ai-note">The computer is deciding.</p>` : ""}
        </div></div>`;
      ov.hidden = false; this.cardOpen = true;
      const btns = [...ov.querySelectorAll(".card-actions .btn")];
      const done = (i) => {
        ov.hidden = true; ov.innerHTML = ""; this.cardOpen = false;
        const sb = $("#spinBtn"); if (sb && !sb.disabled) sb.focus({ preventScroll: true });
        resolve(choices[i].value);
      };
      if (isAI) {
        btns.forEach(b => b.disabled = true);
        const idx = Math.max(0, choices.findIndex(c => c.value === fallback));
        setTimeout(() => { if (btns[idx]) btns[idx].classList.add("chosen"); }, 700);
        setTimeout(() => done(idx), 1500);
      } else {
        btns.forEach(b => b.addEventListener("click", () => done(+b.dataset.i)));
        const first = btns.find(b => b.classList.contains("primary") && !b.disabled) || btns.find(b => !b.disabled);
        if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
      }
    });
  },
  async pickPlayer(p, candidates, title, text, aiPick) {
    if (!candidates.length) return null;
    const v = await this.card({ p, kind: "pick", icon: "arrowOut", kicker: "Choose a rival", title, text,
      choices: candidates.map(c => ({ label: c.name, value: c.id })), ai: aiPick ? aiPick.id : candidates[0].id });
    return candidates.find(c => c.id === v);
  },
  async pickNumber(p, title, text, disabled = [], aiPick) {
    const ch = [];
    for (let i = 1; i <= 10; i++) ch.push({ label: String(i), value: i, disabled: disabled.includes(i) });
    let ai = aiPick;
    if (!ai || disabled.includes(ai)) ai = ch.find(c => !c.disabled).value;
    return this.card({ p, kind: "numbers", icon: "star", kicker: "Choose a gondola", title, text, choices: ch, ai });
  },

  /* ---------- codex ---------- */
  codex(tab = "ideas") {
    const ov = $("#overlay2");

    const draw = () => {

        <div class="cx-body">${body()}</div></div></div>`;
      ov.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.k; draw(); ov.querySelector(`.tab[data-k="${tab}"]`).focus(); }));
      $("#cxClose").addEventListener("click", () => { ov.hidden = true; ov.innerHTML = ""; });
    };
    draw(); ov.hidden = false;
    ov.onkeydown = e => { if (e.key === "Escape") { ov.hidden = true; ov.innerHTML = ""; } };
    setTimeout(() => $("#cxClose") && $("#cxClose").focus(), 30);

  /* ---------- final ---------- */
  final(results) {
    return new Promise(resolve => {
      const ov = $("#overlay");
      const max = Math.max(1, ...results.map(r => Math.max(r.love, r.work, -r.neurosis)));

          <li style="--pc:${r.p.color}">
            <div class="rk-head"><span class="rk-n">${i + 1}</span>${medalSVG(r.p, 46)}<span class="rk-egg">${Psyche.portraitSVG(r.p, "mini")}</span>
              <div class="rk-t"><strong>${esc(r.p.name)}</strong><span>${esc(r.p.endLabel || "")}</span></div>
              <button class="btn rk-nb" data-nb="${r.p.id}">Open the notebook</button>
              <span class="rk-total">${fmtK(r.total)}</span></div>
            <div class="rk-bars">
              <div><span class="bl">Love</span>${bar(r.love, "love")}<span class="bv">${fmtK(r.love)}</span></div>
              <div><span class="bl">Work</span>${bar(r.work, "work")}<span class="bv">${fmtK(r.work)}</span></div>
              <div><span class="bl">Neurosis</span>${bar(r.neurosis, "neur")}<span class="bv">${fmtK(r.neurosis)}</span></div>
            </div>
            <details ${i === 0 ? "open" : ""}><summary>Case history and scoring</summary>
              <p class="history">${r.history}</p>
              <p class="epilogue"><b>In life.</b> ${esc(r.epilogue)}</p>
              <p class="breakdown">${r.lines.map(esc).join("; ")}.</p>
            </details>
          </li>`).join("")}</ol>
        <div class="card-actions"><button class="btn primary big" id="againBtn">Begin another life</button><button class="btn" id="finCodex">Read the codex</button></div>
      </div></div>`;
      ov.hidden = false;
      $("#againBtn").addEventListener("click", () => { ov.hidden = true; ov.innerHTML = ""; resolve("again"); });
      $("#finCodex").addEventListener("click", () => this.codex("cases"));
      ov.querySelectorAll(".rk-nb").forEach(b => b.addEventListener("click", () => Notebook.open({ pid: +b.dataset.nb })));
      setTimeout(() => $("#againBtn").focus({ preventScroll: true }), 50);
    });
  }
};

/* =====================================================================
   PSYCHE — the three agencies on the wheel, portraits, the notebook
   ===================================================================== */
const AGENCY = {
  id:  { name: "Id",        de: "Es",       color: "#9C2A24" },
  sup: { name: "Super-ego", de: "Über-Ich", color: "#4E66AE" },
  ego: { name: "Ego",       de: "Ich",      color: "#E8E1CC" }
};
const STAGES5 = [
  { k: "oral", name: "Oral" }, { k: "anal", name: "Anal" }, { k: "oedipal", name: "Oedipal" },
  { k: "latency", name: "Latency" }, { k: "genital", name: "Puberty" }
];
const EGG = "M50 4 C78 4 94 34 94 70 C94 104 74 128 50 128 C26 128 6 104 6 70 C6 34 22 4 50 4 Z";
const EGG_OPEN = "M38 127.4 C21 124 6 102 6 70 C6 34 22 4 50 4 C78 4 94 34 94 70 C94 102 79 124 62 127.4";
const NUMWORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const nw = n => NUMWORDS[n] || String(n);
const listJoin = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const plural = (n, one, many) => `${nw(n)} ${n === 1 ? one : many}`;
let PSY_UID = 0;

const Psyche = {
  ID_ORDER: [8, 3, 10, 5, 1],
  SUP_ORDER: [2, 7, 4, 9],
  gains(p) { return Math.min(3, (p.analysisGains || 0) + Math.floor(p.kultur.length / 2)); },
  compute(p) {
    let idN = Math.min(5, 1 + Math.floor(p.libido / 4));
    let supN = p.severity ? Math.min(4, p.severity + Math.floor(p.guilt / 3)) : 0;
    const minSup = p.severity ? 1 : 0, g = this.gains(p);
    for (let i = 0; i < g; i++) {
      if (supN > idN && supN > minSup) supN--;
      else if (idN > 1) idN--;
      else if (supN > minSup) supN--;
    }
    let egoN = 10 - idN - supN;
    if (egoN < 2) { idN -= 2 - egoN; egoN = 2; }
    const map = {};
    for (let n = 1; n <= 10; n++) map[n] = "ego";
    this.ID_ORDER.slice(0, idN).forEach(n => { map[n] = "id"; });
    this.SUP_ORDER.slice(0, supN).forEach(n => { map[n] = "sup"; });
    return { idN, supN, egoN, map, gains: g };
  },
  stageIndex(p) {
    const n = Board.G[p.pos], m = { oral: 0, anal: 1, oedipal: 2, latency: 3, genital: 4 };
    if (n.stage && m[n.stage] !== undefined) return m[n.stage];
    if (n.seg === "A1" || n.seg === "A2") return 2;
    return 5;
  },
  fixations(p) {
    const fx = { oral: 0, anal: 0, oedipal: 0 };
    p.story.filter(e => e.k === "fix").forEach(e => { if (fx[e.stage] !== undefined) fx[e.stage]++; });
    return fx;
  },
  tips(p, ps) {
    const rule = Game.psycheRule !== false, sev = p.severity, oe = p.story.find(e => e.k === "oedipus");
    const id = `Id (Es): ${ps.idN} of the 10 gondolas. Libido ${p.libido}, the reservoir of the drives, ruled by the pleasure principle.` +
      (rule ? ` On a red gondola the id takes the reins: you drive 2 spaces further${sev ? " and conscience charges 1 guilt" : ""}.` : "") +
      (p.libido >= 12 ? " The pressure is high; sublimation would calm it." : "");
    const sup = sev
      ? `Super-ego (Über-Ich): ${ps.supN} of 10 gondolas. Severity ${sev}, guilt ${p.guilt}.` +
        (oe ? (oe.t === "dissolve" ? " Installed as the heir of a dissolved Oedipus complex." : " Installed after mere repression, which made it stricter.") : "") +
        (rule ? " On a blue gondola it inhibits you: you drive half as far, and the self-punishment eases 1 guilt." : "")
      : "Super-ego (Über-Ich): not yet installed. It will be set up at the crossroads, as the heir of the Oedipus complex. Until then there is no guilt to pay.";
    const ego = `Ego (Ich): ${ps.egoN} of 10 gondolas${ps.gains ? `, ${nw(ps.gains)} won back by analysis and sublimation` : ""}. It serves three masters: the id, the super-ego and the outside world.` +
      (rule ? " On an ivory gondola it tests reality first: you may adjust the move by one space." : "");
    const pend = [];
    if (p.returnQueue) pend.push(`${plural(p.returnQueue, "repression", "repressions")} due back at the next payday`);
    if (p.complex) pend.push("the Oedipus complex, repressed and waiting to return");
    if (p.deferred.length) pend.push(`${plural(p.deferred.length, "denied blow", "denied blows")} waiting for payday`);
    const rep = `The repressed: ${p.symptoms.length ? "symptoms (solid dots): " + p.symptoms.join(", ") + "." : "no symptoms."}` +
      (pend.length ? ` Waiting to return (open rings): ${pend.join("; ")}.` : "") + " The double line is Freud’s mark for the barrier of repression.";
    const cs = "Perception and consciousness: the surface that faces the world, drawn by Freud as a cap on the ego. The ledger shows only what reaches it.";
    return { id, sup, ego, rep, cs };
  },
  portraitSVG(p, size = "mini") {
    const ps = this.compute(p), t = this.tips(p, ps), u = "psy" + (++PSY_UID);
    const idTop = 126 - (24 + ps.idN * 9);
    const supW = p.severity ? 8 + ps.supN * 4.5 : 0, supR = 6 + supW;
    const libOp = Math.min(0.92, 0.3 + p.libido / 20).toFixed(2);
    const syms = p.symptoms.length, pend = p.returnQueue + (p.complex ? 1 : 0) + p.deferred.length;
    const repTop = Math.max(24, idTop - 20), repH = 44;
    const dots = [];
    for (let i = 0; i < Math.min(6, syms + pend); i++) {

/* ---------- global tooltip for [data-tip] ---------- */
const Tip = {
  el: null,
  init() {
    this.el = document.createElement("div");
    this.el.className = "tipg"; this.el.hidden = true; this.el.setAttribute("role", "tooltip");
    document.body.appendChild(this.el);
    const show = e => {
      const t = e.target.closest && e.target.closest("[data-tip]");
      if (!t) return;
      this.el.textContent = t.getAttribute("data-tip");
      this.el.hidden = false;
      const r = t.getBoundingClientRect(), w = this.el.offsetWidth, h = this.el.offsetHeight;
      let x = r.left + r.width / 2 - w / 2, y = r.top - h - 10;
      if (y < 8) y = r.bottom + 10;
      x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
      this.el.style.left = x + "px"; this.el.style.top = y + "px";
    };
    document.addEventListener("mouseover", show);
    document.addEventListener("focusin", show);
    document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest("[data-tip]")) this.hide(); });
    document.addEventListener("focusout", () => this.hide());
    window.addEventListener("scroll", () => this.hide(), true);
  },
  hide() { if (this.el) this.el.hidden = true; }
};

/* =====================================================================
   GAME ENGINE
   ===================================================================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
class Deck {
  constructor(items, rng) { this.src = items.slice(); this.rng = rng; this.pile = []; this.refill(); }
  refill() { this.pile = this.src.slice(); for (let i = this.pile.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [this.pile[i], this.pile[j]] = [this.pile[j], this.pile[i]]; } }
  draw(filter = () => true) {
    let i = this.pile.findIndex(filter);
    if (i < 0) { this.refill(); i = this.pile.findIndex(filter); }
    if (i < 0) i = 0;
    return this.pile.splice(i, 1)[0];
  }
  putBack(card) { this.pile.push(card); }
}

const Game = {
  players: [], turn: 0, G: null, over: false, rng: Math.random, tollOwner: null, firstRetiree: null,
  spinResolver: null, cur: null, turnStart: null, round: 1,

  /* ---------- timing ---------- */
  wait(ms) {

  },
  stepMs(p) {

  r10() { return 1 + Math.floor(this.rng() * 10); },

  /* ---------- setup ---------- */

      symptoms: [], kultur: [], defenses: [], transference: [], cathexis: [],
      house: false, career: null, object: null, children: [], complex: 0, character: null,
      skip: 0, shield: 0, halfNextPay: false, returnQueue: 0, deferred: [], mourning: 0, anacliticGiven: 0,
      lucky: 0, retired: false, endLabel: "", couchSessions: 0, cured: 0,

  async start(cfg) {

      dream: new Deck(DREAMS.filter(d => !d.persona), this.rng), slip: new Deck(SLIPS, this.rng), joke: new Deck(JOKES, this.rng),
      kultur: new Deck(KULTUR, this.rng), academic: new Deck(CAREERS.academic, this.rng), trade: new Deck(CAREERS.trade, this.rng)
    };

    for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
    const keys = cfg.personas || [cfg.persona, ...others.slice(0, cfg.rivals)];
    this.players = keys.map((k, i) => this.newPlayer(i, k, cfg.allAI ? false : (i === 0 ? true : !!cfg.rivalsHuman)));
    this.players.forEach(p => { if (p.persona === "freud") p.kultur.push({ name: "A first antiquity", value: 4000 }); });
    this.visits = {};
    this.psycheRule = cfg.psyche !== false;
    const firstConcept = { hans: "phobia", dora: "hysteria", rat: "obsession", wolf: "deferred", anna: "hysteria", freud: "dreamwork" };
    this.players.forEach(p => {
      const per = PERSONAS.find(x => x.key === p.persona);
      this.jot(p, firstConcept[p.persona], `Case opened: ${per.caseTitle} (${per.caseYear}). Presenting: ${per.weakness.name.toLowerCase()}.`);
    });
    this.turn = 0; this.over = false; this.tollOwner = null; this.firstRetiree = null; this.round = 1;
    Board.tokens = {}; Board.tokenLayer.innerHTML = "";

    Board.placeTokens(this.players);
    document.getElementById("log").innerHTML = "";
    UI.log(null, `A new game begins with ${this.players.map(p => p.name).join(", ")}.`);
    UI.renderStrip(this.players, this.players[0]);

    if (this.peeked) return "peek";

  },
  async loop() {

      if (!p.retired) await this.takeTurn(p);
      if (this.players.every(q => q.retired)) { this.over = true; break; }
      this.turn = (this.turn + 1) % this.players.length;
      if (this.turn === 0) this.round++;
      if (this.peekRound && this.round >= this.peekRound) { this.peeked = true; return; }
    }
  },

  /* ---------- helpers ---------- */
  rivals(p, includeRetired = false) { return this.players.filter(q => q !== p && (includeRetired || !q.retired)); },
  freudFor(p) { return this.players.find(q => q.persona === "freud" && q !== p); },
  stage(p) { const n = this.G[p.pos]; if (n.seg === "END") return p.endLabel; return STAGE_LABEL[n.stage] || STAGE_LABEL[n.seg] || ""; },
  estimate(p) { return this.score(p).total; },
  leader(p) {

  },
  note(p, k, t, stage) { p.story.push({ k, t, stage }); },
  jot(p, c, t) {

  refresh(p) {

  randomSymptom(p) {
    const pool = SYMPTOM_NAMES.filter(s => !p.symptoms.includes(s) && s !== "Fear of carts");

  },
  addSymptom(p, s, why) {

  },
  addDefense(p, d) {
    if (p.defenses.length >= 4) { UI.log(p, `${p.name} already holds four defences; the ${DEFENSES[d].name} card is returned.`); return false; }

  removeDefense(p, d) { const i = p.defenses.indexOf(d); if (i >= 0) p.defenses.splice(i, 1); },
  drawKultur(p) {

    return k;
  },
  borrow(p, need) {
    const n = Math.ceil(need / 5000) * 5000;
    p.debt += n; p.kronen += n;
    UI.log(p, `${p.name} signs a promissory note for ${fmtK(n)}.`);
  },
  gain(p, amt, o = {}) {
    if (amt <= 0) return;
    p.kronen += amt;
    if (o.event && amt >= 4000) {
      const h = this.players.find(q => q !== p && q.transference.includes("positive"));
      if (h) {
        h.transference.splice(h.transference.indexOf("positive"), 1);
        if (p.transference.includes("abstinence")) {
          p.transference.splice(p.transference.indexOf("abstinence"), 1);
          UI.log(p, `${h.name} plays Positive transference, but ${p.name} keeps the rule of abstinence.`);
        } else {
          const half = Math.floor(amt / 2);
          p.kronen -= half; h.kronen += half;
          UI.log(h, `Positive transference: ${h.name} takes ${fmtK(half)} of ${p.name}’s windfall.`);
          UI.toast(h, "Positive transference", [`${fmtK(half)} flows from ${esc(p.name)}`]);
        }
      }
    }
  },
  async pay(p, amt, o = {}) {
    amt = Math.round(amt);

    if (p.kronen < amt && !o.noBorrow) this.borrow(p, amt - p.kronen);
    p.kronen -= amt;
    if (o.to) o.to.kronen += amt;
    if (o.event && amt >= 3000 && p.transference.includes("negative")) {
      const t = this.rivals(p, true).reduce((a, b) => (b.kronen > a.kronen ? b : a), this.rivals(p, true)[0]);
      if (t) {
        p.transference.splice(p.transference.indexOf("negative"), 1);
        if (t.transference.includes("abstinence")) {
          t.transference.splice(t.transference.indexOf("abstinence"), 1);
          UI.log(p, `${p.name} plays Negative transference on ${t.name}, who answers with abstinence.`);
        } else {
          const half = Math.floor(amt / 2);
          if (t.kronen < half) this.borrow(t, half - t.kronen);
          t.kronen -= half; p.kronen += half;
          UI.log(p, `Negative transference: ${t.name} pays ${p.name} ${fmtK(half)}.`);

  },

  /* ---------- spinning ---------- */
  async spin(p, purpose = "move", label) {

    out.textContent = "";
    const agMap = purpose === "move" && this.psycheRule ? Psyche.compute(p).map : null;
    Wheel.setAgencies(agMap);
    UI.renderWheelKey(purpose === "move" && this.psycheRule ? p : null);
    if (p.human) {
      btn.disabled = false;
      btn.textContent = label || "Spin the wheel";
      hint.textContent = purpose === "move" ? "Press the space bar or the button." : "The wheel decides the outcome.";
      btn.focus({ preventScroll: true });
      await new Promise(res => { this.spinResolver = res; });
      this.spinResolver = null;
    } else {
