      hint.textContent = "";
      await this.wait(purpose === "move" ? 450 : 250);
    }
    btn.disabled = true;
    const r = this.r10();
    await Wheel.spin(r, ms);
    out.textContent = r;
    hint.textContent = "";
    btn.textContent = "Spin the wheel";
    return r;
  },

  /* ---------- turn ---------- */
  async takeTurn(p) {
    this.cur = p;
    p.turns = (p.turns || 0) + 1;
    UI.setTurn(p, this.stage(p));
    this.refresh(p);
    if (UI.speed !== "instant") { Board.front(p); Board.markCurrent(p.pos); Board.follow(p); }
    if (p.skip > 0) {
      p.skip--;
      UI.log(p, `${p.name} misses a turn.`);
      UI.toast(p, `${p.name} misses a turn`, []);
      await this.wait(900);
      return;
    }
    const r = await this.spin(p, "move");
    UI.log(p, `${p.name} spins ${r}.`);
    await this.spinPayouts(p, r);
    if (p.persona === "hans" && p.flags.phobia && r === 1) {
      UI.log(p, "A cart-horse has fallen in the street. Little Hans will not leave the house.");
      this.jot(p, "phobia", "Spun a 1: too frightened of the horses to go out.");
      await this.info(p, { kind: "event", icon: "horse", kicker: "Horse phobia", title: "Too frightened to go out",
        text: "You spun a 1. Somewhere a cart-horse has fallen, and you stay home. A session on the couch would lift this.", src: "Analysis of a Phobia in a Five-Year-Old Boy (1909)" });
      return;
    }
    if (p.persona === "anna" && r === 10) {
      p.libido++;
      UI.log(p, "Anna O. drifts into her private theatre: +1 libido, no move.");
      this.jot(p, "hysteria", "An absence: drifted into the private theatre.");
      await this.info(p, { kind: "event", icon: "e_chimney", kicker: "Private theatre", title: "An absence", chips: [{ t: "+1 libido", tone: "good" }],
        text: "You spun a 10 and drift into a waking dream. Breuer’s patient called her daydreaming her private theatre.", src: "Studies on Hysteria (1895)" });
      this.refresh(p);
      return;
    }
    let steps = r;
    if (this.psycheRule) steps = await this.agency(p, r);
    this.turnStart = p.pos;
    this.turnTrailLen = p.trail.length;
    await this.move(p, steps);
    Board.layout(this.players);
    this.refresh(p);
  },
  async agency(p, r) {
    const ps = Psyche.compute(p), ag = ps.map[r];
    if (ag === "id") {
      p.surges++;
      const g = p.severity ? 1 : 0;
      p.guilt += g;
      UI.log(p, `Gondola ${r} belongs to the id: ${p.name} drives ${r + 2}${g ? " and conscience charges 1 guilt" : ""}.`);
      UI.toast(p, "The id takes the reins", [`Drive ${r + 2} instead of ${r}`, ...(g ? ["Conscience charges 1 guilt"] : ["No super-ego yet to object"])]);
      this.jot(p, "structure", `The id took the reins on gondola ${r}: drove ${r + 2}.${g ? " Conscience charged 1 guilt." : ""}`);
      Sound.tone(330, 0.12, "sawtooth", 0.03);
      this.refresh(p);
      return r + 2;
    }
    if (ag === "sup") {
      p.brakes++;
      const st = Math.ceil(r / 2), eased = p.guilt > 0;
      if (eased) p.guilt--;
      UI.log(p, `Gondola ${r} belongs to the super-ego: ${p.name} is inhibited and drives only ${st}${eased ? "; the self-punishment eases 1 guilt" : ""}.`);
      UI.toast(p, "Inhibition", [`Drive ${st} instead of ${r}`, ...(eased ? ["The self-punishment eases 1 guilt"] : [])]);
      this.jot(p, "anxiety", `Inhibited on gondola ${r}: drove only ${st}.${eased ? " Self-punishment eased the guilt." : ""}`);
      this.refresh(p);
      return st;
    }
    // the ego: reality testing
    const opts = [r - 1, r, r + 1].filter(x => x >= 1).map(x => { const d = this.simulate(p, x); return { steps: x, dest: d, title: this.G[d].title || (TYPE_TEXT[this.G[d].type] || {}).title || "" }; });
    let pick;
    if (p.human) pick = await UI.egoChoose(p, r, opts);
    else {
      let best = opts.find(o => o.steps === r), bv = -1e9;
      opts.forEach(o => { const v = this.valueOf(p, o.dest) + o.steps * 120 + (o.steps === r ? 60 : 0); if (v > bv) { bv = v; best = o; } });
      pick = best.steps;
    }
    if (pick !== r) {
      p.adjusts++;
      const d = opts.find(o => o.steps === pick);
      UI.log(p, `Reality testing: ${p.name} drives ${pick} instead of ${r}, to reach ${esc(d.title)}.`);
      if (!p.human) UI.toast(p, "Reality testing", [`Drives ${pick} instead of ${r}, to reach ${esc(d.title)}`]);
      this.jot(p, "pleasure", `Reality testing on gondola ${r}: chose ${pick} to reach “${d.title}”.`);
    }
    return pick;
  },
  simulate(p, steps) {
    let pos = p.pos;
    for (let s = 0; s < steps; s++) {
      const n = this.G[pos];
      let nx = null;
      if (n.next.length === 1) nx = n.next[0];
      else if (n.next.length > 1) nx = p.route[n.id] || n.next[0];
      if (!nx) break;
      pos = nx;
      const m = this.G[pos];
      if (m.type === "stop" && !p.done[m.id]) break;
    }
    return pos;
  },
  valueOf(p, id) {
    const n = this.G[id], rv = this.rivals(p, true).length;
    switch (n.type) {
      case "payday": return 1500;
      case "kultur": return p.libido >= 2 ? 4500 : 0;
      case "baby": return 1500 + 500 * rv;
      case "twins": return 3000 + 1000 * rv;
      case "joke": return p.persona === "dora" ? 0 : 1500;
      case "dream": return 700;
      case "slip": return -700;
      case "anxiety": return p.shield ? 0 : -Math.min(6000, this.penCost(Object.assign({}, n.penalty, { guilt: n.penalty && n.penalty.guilt === "severity" ? Math.max(1, p.severity) : (n.penalty || {}).guilt, symptom: n.penalty && n.penalty.symptom ? "x" : undefined })));
      case "conscience": return -1500 * Math.max(0, p.severity - (p.kultur.length >= 2 ? 1 : 0));
      case "projection": return 2500;
      case "couch": return (p.symptoms.length || p.guilt >= 2) ? 1500 : -200;
      case "optDefense": case "optCathexis": case "optHouse": return 300;
      case "fixation": return -600;
      case "plain": { const e = n.effect || {}; return (e.libido || 0) * 1000 + (e.kronen || 0) - (e.guilt || 0) * 1500; }
      case "event": return ({ sibling: -1500, horseFalls: -800, dams: 800, repetition: p.flags.repeated ? 0 : -600, civilization: -1500, group: 500,
        whereid: p.guilt ? 2500 : 500, mourning: -2500, uncanny: -500, puberty: 3000, repressComplex: -2000, fortda: 0 })[n.handler] || 0;
      default: return 0;
    }
  },
  async spinPayouts(p, r) {
    for (const q of this.players) {
      if (q.cathexis.includes(r)) {
        this.gain(q, 1000);
        UI.log(q, `Gondola ${r} comes up: ${q.name}’s cathexis pays ${fmtK(1000)}.`);
        UI.toast(q, "Cathexis pays", [`Gondola ${r}: +${fmtK(1000)}`]);
      }
    }
    const fr = this.firstRetiree;
    if (fr && fr !== p && fr.lucky === r) {
      await this.pay(p, 1000, { to: fr });
      UI.log(p, `${p.name} spun ${fr.name}’s lucky gondola and pays ${fmtK(1000)}.`);
    }
  },

  /* ---------- movement ---------- */
  nextOf(p, n) {
    if (!n.next.length) return null;
    if (n.next.length === 1) return n.next[0];
    return p.route[n.id] || null;
  },
  isStopFor(p, n) {
    if (n.type === "stop") return !p.done[n.id];
    return false;
  },
  async stepTo(p, id) {
    const from = p.pos;
    p.trail.push(from); p.pos = id;
    Board.front(p);
    await Board.stepToken(p, from, id, this.stepMs(p));
    if (UI.speed !== "instant") Sound.step();
  },
  async move(p, steps) {
    for (let s = 0; s < steps; s++) {
      const n = this.G[p.pos];
      const nx = this.nextOf(p, n);
      if (!nx) break;
      await this.stepTo(p, nx);
      const m = this.G[nx];
      if (this.isStopFor(p, m)) { await this.land(p, m); return; }
      if (s < steps - 1 && m.type === "fork" && !p.route[m.id]) {
        Board.markCurrent(m.id); Board.pulse(m.id);
        await this[m.handler](p, m);
        this.refresh(p);
      }
      if (s < steps - 1 && m.pass) await this.passEffect(p, m);
    }
    await this.land(p, this.G[p.pos]);
  },
  async moveBack(p, k) {
    let moved = 0;
    while (moved < k && p.trail.length) {
      const from = p.pos, to = p.trail.pop();
      p.pos = to;
      await Board.stepToken(p, from, to, this.stepMs(p));
      moved++;
    }
    Board.layout(this.players);
    if (moved) UI.log(p, `${p.name} goes back ${moved} ${moved === 1 ? "space" : "spaces"}.`);
  },
  async teleport(p, id) {
    const from = p.pos;
    p.trail.push(from); p.pos = id;
    await Board.stepToken(p, from, id, UI.speed === "instant" ? 0 : 500);
    Board.layout(this.players);
  },

  /* ---------- landing ---------- */
  isBad(n) {
    return ["anxiety", "conscience"].includes(n.type) ||
      ["horseFalls", "sibling", "repetition", "mourning", "war"].includes(n.handler);
  },
  async land(p, n) {
    (this.visits[n.id] = this.visits[n.id] || []).push({ pid: p.id, turn: p.turns || 0 });
    Board.layout(this.players); Board.markCurrent(n.id); Board.pulse(n.id); Board.follow(p);
    UI.setTurn(p, this.stage(p));
    this.refresh(p);
    if (p.persona === "rat" && !p.flags.undoUsed && this.cur === p && this.turnStart && this.turnStart !== n.id && this.isBad(n) && !p.done[n.id]) {
      const v = await UI.card({ p, kind: "ability", icon: "e_pincenez", kicker: "Undoing", title: "Undo this move?",
        text: `You have landed on ${esc(n.title)}. Once per game the obsessional can take a move back, as if it had never happened.`,
        choices: [{ label: "Undo the move", value: "undo", primary: true }, { label: "Let it stand", value: "stay" }], ai: "undo" });
      if (v === "undo") {
        p.flags.undoUsed = true;
        const from = p.pos;
        while (p.trail.length > this.turnTrailLen) p.trail.pop();
        p.pos = this.turnStart;
        await Board.stepToken(p, from, p.pos, UI.speed === "instant" ? 0 : 450);
        Board.layout(this.players);
        UI.log(p, "The Rat Man undoes his move. Something of it, as usual, remains.");
        this.jot(p, "obsession", `Undoing: took back the move that landed on “${n.title}”.`);
        this.note(p, "undo", "undid a move");
        return;
      }
    }
    const h = this["on_" + n.type];
    if (h) await h.call(this, p, n);
    this.refresh(p);
  },
  async passEffect(p, n) {
    (this.visits[n.id] = this.visits[n.id] || []).push({ pid: p.id, turn: p.turns || 0, passed: true });
    if (n.type === "payday") return this.payday(p, n, false);
    if (n.type === "toll") return this.toll(p, n);
    if (n.handler && this[n.handler]) return this[n.handler](p, n, true);
  },

  /* ---------- card helpers ---------- */
  specFor(p, n, extra = {}) {
    const s = styleFor(n);
    return Object.assign({ p, kind: n.type, icon: s.icon, iconBg: s.fill === C.bone ? C.ink : s.fill, iconColor: s.fill === C.bone ? C.bone : s.ic,
      kicker: n.type === "anxiety" ? ANX_KICK[n.kind] : KICKERS[n.type], title: n.title, de: n.de, text: n.text, src: n.src }, extra);
  },
  async info(p, spec) {
    if (p.human) return UI.card(spec);
    UI.toast(p, spec.title, (spec.chips || []).map(c => esc(c.t)));
    await this.wait(UI.speed === "normal" ? 1100 : 400);
  },
  normPen(p, pen = {}) {
    const q = Object.assign({}, pen);
    if (q.guilt === "severity") q.guilt = Math.max(1, p.severity);
    if (q.symptom === "random") q.symptom = this.randomSymptom(p);
    return q;
  },
  penCost(pen) {
    if (!pen) return 0;
    return Math.abs(pen.kronen || 0) + Math.abs(pen.libido || 0) * 1500 + (pen.guilt || 0) * 1500 +
      (pen.symptom ? 4000 : 0) + (pen.skip || 0) * 2500 + (pen.back || 0) * 400;
  },
  penaltyChoices(p, pen) {
    if (!this.penCost(pen)) return [{ label: "Continue", value: "accept", primary: true }];
    const ch = [{ label: "Accept it", value: "accept", primary: true }];
    if (p.persona === "dora" && !p.flags.doorUsed) ch.push({ label: "Walk out", sub: "once per game", value: "door" });
    [...new Set(p.defenses)].forEach(d => ch.push({ label: DEFENSES[d].name, sub: this.defenseSub(d, pen, p), value: "def:" + d, hint: DEFENSES[d].text }));
    return ch;
  },
  defenseSub(d, pen, p) {
    return { repression: "returns as a symptom", sublimation: "costs 1 libido, gives a tile", projection: "a rival takes it",
      reaction: pen.kronen ? `collect ${fmtK(Math.round(-pen.kronen / 2))}, +1 guilt` : "+1 guilt instead",
      denial: "bill arrives at payday", regression: "miss a turn instead",
      displacement: pen.kronen ? `pay ${Math.ceil(-pen.kronen / 1500)} libido instead` : (pen.libido ? `pay ${fmtK(-pen.libido * 1500)} instead` : "shift the charge") }[d];
  },
  aiDefense(p, pen) {
    const cost = this.penCost(pen);
    if (cost < 2000) return "accept";
    const has = d => p.defenses.includes(d);
    const opts = [["accept", cost]];
    if (p.persona === "dora" && !p.flags.doorUsed && cost >= 4500) opts.push(["door", 0]);
    if (has("projection") && this.rivals(p).length) opts.push(["def:projection", -400]);
    if (has("sublimation")) opts.push(["def:sublimation", (p.libido >= 1 ? 1000 : 0) - 9000]);
    if (has("reaction")) opts.push(["def:reaction", 1500 - (pen.kronen ? -pen.kronen / 2 : 0)]);
    if (has("repression")) opts.push(["def:repression", 3400]);
    if (has("regression")) opts.push(["def:regression", 2500]);
    if (has("denial")) opts.push(["def:denial", cost * 0.8]);
    if (has("displacement")) {
      let c = cost;
      if (pen.kronen && p.libido >= Math.ceil(-pen.kronen / 1500) + 1) c = cost + pen.kronen + Math.ceil(-pen.kronen / 1500) * 1000;
      else if (pen.libido) c = cost - Math.abs(pen.libido) * 1500 + Math.abs(pen.libido) * 1500 * (p.kronen > 8000 ? 0.6 : 1.2);
      opts.push(["def:displacement", c]);
    }
    opts.sort((a, b) => a[1] - b[1]);
    return opts[0][0];
  },
  async resolvePenalty(p, pen, choice, src) {
    if (!this.penCost(pen)) return;
    if (choice === "door") {
      p.flags.doorUsed = true;
      UI.log(p, `Dora walks out on ${esc(src)}. The door closes behind her.`);
      this.jot(p, "transference", `Walked out on “${src}”.`);
      this.note(p, "door", src);
      return;
    }
    if (choice && choice.startsWith("def:")) {
      const d = choice.slice(4);
      this.removeDefense(p, d);
      UI.log(p, `${p.name} plays ${DEFENSES[d].name} against ${esc(src)}.`);
      this.jot(p, "defences", `Met “${src}” with ${DEFENSES[d].name.toLowerCase()}.`);
      this.note(p, "defense", DEFENSES[d].name);
      return this.applyDefense(p, d, pen, src);
    }
    return this.applyPenaltyRaw(p, pen, src);
  },
  async applyPenaltyRaw(p, pen, src) {
    if (pen.kronen) await this.pay(p, -pen.kronen, { event: true });
    if (pen.libido) p.libido = Math.max(0, p.libido + pen.libido);
    if (pen.guilt) p.guilt += pen.guilt;
    if (pen.symptom) this.addSymptom(p, p.symptoms.includes(pen.symptom) ? this.randomSymptom(p) : pen.symptom, src);
    if (pen.skip) p.skip += pen.skip;
    if (pen.back) await this.moveBack(p, pen.back);
    if (pen.kronen < 0 || pen.libido < 0 || pen.symptom) Sound.bad();
  },
  async applyDefense(p, d, pen, src) {
    switch (d) {
      case "repression": p.returnQueue++; break;
      case "sublimation": p.libido = Math.max(0, p.libido - 1); this.drawKultur(p); break;
      case "projection": {
        const rs = this.rivals(p);
        const t = await UI.pickPlayer(p, rs, "Project it onto whom?", "Choose the rival who will take the blow.", this.leader(p) || rs[0]);
        if (t) { UI.log(p, `${p.name} projects ${esc(src)} onto ${t.name}.`); await this.applyPenaltyRaw(t, pen, src + ", projected"); }
        break;
      }
      case "reaction":
        if (pen.kronen < 0) this.gain(p, Math.round(-pen.kronen / 2));
        if (pen.libido < 0) p.libido += 1;
        p.guilt += 1; break;
      case "denial": p.deferred.push(Object.assign({}, pen, { src })); break;
      case "regression": p.skip += 1; break;
      case "displacement": {
        const q = Object.assign({}, pen);
        if (pen.kronen && (p.libido >= Math.ceil(-pen.kronen / 1500) || !pen.libido)) { q.libido = (q.libido || 0) - Math.ceil(-pen.kronen / 1500); q.kronen = 0; }
        else if (pen.libido) { q.kronen = (q.kronen || 0) + pen.libido * 1500; q.libido = 0; }
        await this.applyPenaltyRaw(p, q, src);
        break;
      }
    }
  },
  async applyEffect(p, eff = {}, src = "") {
    if (eff.kronen > 0) this.gain(p, eff.kronen, { event: true });
    if (eff.kronen < 0) await this.pay(p, -eff.kronen);
    if (eff.libido) p.libido = Math.max(0, p.libido + eff.libido);
    if (eff.guilt) p.guilt = Math.max(0, p.guilt + eff.guilt);
    if (eff.shield) p.shield += eff.shield;
    if (eff.halfNextPay) p.halfNextPay = true;
    if (eff.defense) this.addDefense(p, eff.defense);
    if (eff.kultur) for (let i = 0; i < eff.kultur; i++) this.drawKultur(p);
    if (eff.wolfDream) { p.flags.wolfDream = true; this.note(p, "wolf", "the wolf dream"); this.jot(p, "deferred", "Dreamt of white wolves in the walnut tree; the meaning is deferred."); }
    if (eff.bindTrauma) {
      const i = p.symptoms.indexOf("War neurosis");
      if (i >= 0) { p.symptoms.splice(i, 1); p.cured++; UI.log(p, `${p.name}’s repeating dream binds the war neurosis. It is gone.`); }
    }
    if (eff.symptomToGuilt && p.symptoms.length) {
      const s = p.symptoms.pop(); p.guilt++;
      UI.log(p, `Secondary revision tidies away ${esc(s)}, leaving a little guilt.`);
    }
    if (eff.rivalLibido) {
      const rs = this.rivals(p);
      if (rs.length) {
        const t = await UI.pickPlayer(p, rs, "Choose a rival", "Your rival loses 1 libido.", this.leader(p) || rs[0]);
        if (t) { t.libido = Math.max(0, t.libido + eff.rivalLibido); UI.log(p, `${t.name} loses 1 libido to ${p.name}.`); }
      }
    }
    if (eff.condense && p.libido >= 2) {
      const v = await UI.card({ p, kind: "choice", icon: "laurel", kicker: "Condensation", title: "Trade 2 libido for a Kultur tile?",
        choices: [{ label: "Condense it", value: true, primary: true }, { label: "Keep the libido", value: false }], ai: p.libido >= 3 });
      if (v) { p.libido -= 2; this.drawKultur(p); }
    }
  },
  async resolveCard(p, card, kind, icon, bg) {
    const eff = card.effect || {}, pen = this.normPen(p, card.penalty || {});
    const choice = await UI.card({ p, kind, icon, iconBg: bg, iconColor: C.bone, kicker: KICKERS[kind], title: card.title, text: card.text,
      note: card.note, src: card.src, chips: chipsFor(eff, pen, p), choices: this.penaltyChoices(p, pen), ai: this.aiDefense(p, pen) });
    UI.log(p, `${KICKERS[kind]}: <em>${esc(card.title)}</em>.`);
    this.jot(p, { dream: "dreamwork", slip: "parapraxes", joke: "jokes" }[kind] || "unconscious", `${KICKERS[kind]}: ${card.title}.`);
    const { forward, ...rest } = eff;
    await this.applyEffect(p, rest, card.title);
    await this.resolvePenalty(p, pen, choice, card.title);
    if (Object.keys(rest).length && (rest.kronen > 0 || rest.libido > 0 || rest.guilt < 0)) Sound.good();
    this.refresh(p);
    if (forward) await this.move(p, forward);
  },

  /* ---------- space handlers ---------- */
  async on_start() {},
  async on_end() {},
  async on_plain(p, n) {
    const eff = n.effect || {};
    await this.info(p, this.specFor(p, n, { chips: chipsFor(eff, {}, p) }));
    await this.applyEffect(p, eff, n.title);
    UI.log(p, `${p.name}: ${esc(n.title)}.`);
  },
  async on_payday(p, n) { return this.payday(p, n, true); },
  async on_toll(p, n) { return this.toll(p, n); },
  async on_choice(p, n) { if (n.handler) return this[n.handler](p, n, false); },
  async on_event(p, n) { if (n.handler) return this[n.handler](p, n, false); },
  async on_fork(p, n) {
    if (p.route[n.id]) return this.info(p, this.specFor(p, n, { text: "You have already chosen your road here." }));
    return this[n.handler](p, n);
  },
  async on_stop(p, n) {
    if (p.done[n.id] && n.handler !== "object") {
      return this.info(p, this.specFor(p, n, { text: "You have been here before. The road goes on." }));
    }
    return this[n.handler](p, n);
  },
  async on_dream(p, n) {
    let card;
    if (p.persona === "wolf" && !p.flags.wolfDreamDrawn) { card = DREAMS.find(d => d.id === "wolves"); p.flags.wolfDreamDrawn = true; }
    else if (p.persona === "freud") {
      const a = this.decks.dream.draw(), b = this.decks.dream.draw(c => c.id !== a.id);
      const val = c => this.penCost(this.normPen(p, c.penalty || {})) * -1 + ((c.effect || {}).libido || 0) * 1500 + ((c.effect || {}).kronen || 0) + (-(c.effect || {}).guilt || 0) * 1500 + ((c.effect || {}).shield ? 1500 : 0) + ((c.effect || {}).condense ? 3000 : 0);
      const pick = await UI.card({ p, kind: "dream", icon: "moon", iconBg: "#26336A", iconColor: C.bone, kicker: "Self-analysis",
        title: "Which dream will you interpret?", text: "Professor Freud draws two dreams and chooses one. The other goes back in the deck.",
        choices: [{ label: a.title, value: 0, primary: true }, { label: b.title, value: 1 }], ai: val(a) >= val(b) ? 0 : 1 });
      card = pick === 0 ? a : b;
      this.decks.dream.putBack(pick === 0 ? b : a);
    } else card = this.decks.dream.draw();
    await this.resolveCard(p, card, "dream", "moon", "#26336A");
  },
  async on_slip(p) { await this.resolveCard(p, this.decks.slip.draw(), "slip", "slip", C.madder); },

    const pen = this.normPen(p, n.penalty);

  async on_fixation(p, n) {
    const push = n.push || {};
    const canLeave = p.libido >= 1;
    const v = await UI.card(this.specFor(p, n, {
      note: "Leaving libido behind costs 1 libido now and gives you a Regression card: a station to fall back on later.",
      choices: [
        { label: "Leave libido here", sub: "−1 libido, +Regression", value: "leave", primary: true, disabled: !canLeave },
        { label: "Push on", sub: chipsFor({}, push, p).map(c => c.t).join(", "), value: "push" }],
      ai: canLeave && p.libido >= 3 && p.defenses.length < 3 ? "leave" : (canLeave && this.penCost(push) > 2000 ? "leave" : "push")
    }));
    if (v === "leave") {
      p.libido -= 1; this.addDefense(p, "regression");
      this.note(p, "fix", n.title, n.stage);
      this.jot(p, "fixation", `Left a detachment of libido at “${n.title}”, a station to regress to under pressure.`);

    } else {

    }

  async on_conscience(p, n) {
    const relief = p.kultur.length >= 2 ? 1 : 0;
    const g = Math.max(0, p.severity - relief);
    if (!g) {
      UI.log(p, `${p.name}’s conscience is quiet.`);
      return this.info(p, this.specFor(p, n, { text: (n.text || "") + (p.severity ? " Your Kultur tiles satisfy the ego ideal, and the charge is waived." : " There is no super-ego yet to charge you."), chips: [{ t: "No guilt", tone: "good" }] }));
    }
    const pen = { guilt: g };
    const choice = await UI.card(this.specFor(p, n, { note: relief ? "Your Kultur tiles satisfy the ego ideal: one guilt less." : "", chips: chipsFor({}, pen, p), choices: this.penaltyChoices(p, pen), ai: this.aiDefense(p, pen) }));
    await this.resolvePenalty(p, pen, choice, n.title);
    UI.log(p, `${p.name}’s conscience charges ${g} guilt.`);
  },
  async on_kultur(p, n) {
    const cost = 2;
    if (p.libido < cost) {
      return this.info(p, this.specFor(p, n, { text: (n.text || "") + ` You need ${cost} libido to sublimate, and you have ${p.libido}.` }));
    }
    const v = await UI.card(this.specFor(p, n, {
      note: "Kultur tiles are worth between 5,000 and 20,000 K at the end. You will not see the values until then.",
      choices: [{ label: "Sublimate once", sub: `−${cost} libido`, value: 1, primary: true },
        { label: "Sublimate twice", sub: `−${cost * 2} libido`, value: 2, disabled: p.libido < cost * 2 },
        { label: "Not now", value: 0 }],
      ai: p.libido >= cost * 2 + 2 ? 2 : (p.libido >= cost + 1 ? 1 : 0)
    }));
    for (let i = 0; i < v; i++) { p.libido -= cost; this.drawKultur(p); }
    if (v) { Sound.good(); this.note(p, "kultur", "sublimated"); this.jot(p, "drive", `Sublimated ${nw(v * cost)} libido into ${plural(v, "Kultur tile", "Kultur tiles")}.`); }
  },
  async on_projection(p, n) {
    const rs = this.rivals(p);
    if (!rs.length) return this.info(p, this.specFor(p, n, { text: "There is no one left to project onto." }));
    const lead = this.leader(p) || rs[0];
    const ai = p.symptoms.length ? "sym" : (lead.kronen >= 3000 ? "money" : "back");
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "Take 3,000 K from a rival", value: "money", primary: true },
        { label: "Hand a rival one of your symptoms", value: "sym", disabled: !p.symptoms.length },
        { label: "Send a rival back 5 spaces", value: "back" }], ai
    }));
    const t = await UI.pickPlayer(p, rs, "Project onto whom?", "They will be sure it was never yours.", lead);
    if (!t) return;
    if (v === "money") { await this.pay(t, 3000, { to: p }); UI.log(p, `${p.name} projects: ${t.name} pays ${fmtK(3000)}.`); }
    if (v === "sym") { const s = p.symptoms.pop(); t.symptoms.push(s); UI.log(p, `${p.name} projects ${esc(s)} onto ${t.name}.`); }
    if (v === "back") { UI.log(p, `${p.name} sends ${t.name} back 5 spaces.`); await this.moveBack(t, 5); }
    this.note(p, "proj", t.name);
    this.jot(p, "defences", `Projection onto ${t.name}: ${v === "money" ? "took 3,000 K" : v === "sym" ? "handed over a symptom" : "sent them back five spaces"}.`);
  },
  async on_optDefense(p, n) {
    const all = Object.keys(DEFENSES);
    const offer = [];
    while (offer.length < 3) { const d = all[Math.floor(this.rng() * all.length)]; if (!offer.includes(d)) offer.push(d); }
    const full = p.defenses.length >= 4;
    const pref = ["sublimation", "projection", "repression", "reaction", "displacement", "denial", "regression"];
    let ai = "none";
    if (!full && p.defenses.length < 3) {
      const best = offer.slice().sort((a, b) => pref.indexOf(a) - pref.indexOf(b)).find(d => p.kronen >= DEFENSES[d].price + 2500);
      if (best) ai = best;
    }
    const v = await UI.card(this.specFor(p, n, {
      extra: `<ul class="offer">${offer.map(d => `<li><b>${DEFENSES[d].name}</b> <em>${DEFENSES[d].de}</em>, ${fmtK(DEFENSES[d].price)}. ${esc(DEFENSES[d].text)}</li>`).join("")}</ul>`,
      note: full ? "You already hold four defences, the most anyone can." : "",
      choices: [...offer.map(d => ({ label: `Buy ${DEFENSES[d].name}`, sub: fmtK(DEFENSES[d].price), value: d, disabled: full || p.kronen < DEFENSES[d].price })),
        { label: "No thanks", value: "none", primary: ai === "none" }],
      ai
    }));
    if (v !== "none") { await this.pay(p, DEFENSES[v].price, { noBorrow: true }); this.addDefense(p, v); UI.log(p, `${p.name} buys ${DEFENSES[v].name}.`); Sound.coin(); }
  },
  async on_optCathexis(p, n) {
    if (p.cathexis.length >= 2) return this.info(p, this.specFor(p, n, { text: "You already hold two cathexes, the limit." }));
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "Invest 3,000 K", value: true, primary: true, disabled: p.kronen < 3000 }, { label: "Not now", value: false }],
      ai: p.kronen >= 6500
    }));
    if (!v) return;
    await this.pay(p, 3000, { noBorrow: true });
    const taken = p.cathexis;
    const pick = await UI.pickNumber(p, "Invest in which gondola?", "Whenever anyone spins this number to move, you collect 1,000 K.", taken, 1 + Math.floor(this.rng() * 10));
    p.cathexis.push(pick);
    UI.log(p, `${p.name} cathects gondola ${pick}.`);
  },
  async on_optHouse(p, n) {
    if (p.house) return this.info(p, this.specFor(p, n, { text: "You already have a flat." }));
    const v = await UI.card(this.specFor(p, n, {
      note: "Worth 16,000 K at the end, and untouched by inflation. You may borrow the price.",
      choices: [{ label: "Buy the flat", sub: "10,000 K", value: true, primary: true }, { label: "Keep renting", value: false }],

    }));

  },
  async on_baby(p, n, twins = false) {
    const k = twins ? 2 : 1, each = twins ? 1000 : 500;
    for (let i = 0; i < k; i++) p.children.push(1);
    p.libido += 1;
    for (const q of this.rivals(p, true)) await this.pay(q, each, { to: p });
    Sound.good();
    Board.placeTokens(this.players);
    UI.log(p, twins ? `Twins for ${p.name}: the double arrives. Each rival sends ${fmtK(each)}.` : `His Majesty the Baby joins ${p.name}’s carriage. Each rival sends ${fmtK(each)}.`);
    this.jot(p, twins ? "uncanny" : "narcissism", twins ? "Twins: the double, twice over." : "A child: His Majesty the Baby, the parents’ narcissism reborn.");
    await this.info(p, this.specFor(p, n, { chips: [{ t: `+${k} ${k > 1 ? "children" : "child"}`, tone: "good" }, { t: "+1 libido", tone: "good" }, { t: `+${fmtK(each)} from each rival`, tone: "good" }] }));
  },
  async on_twins(p, n) { return this.on_baby(p, n, true); },
  async on_couch(p, n) {
    const fr = this.freudFor(p);
    const fee = p.persona === "hans" ? 0 : (p.persona === "freud" ? 750 : 1500);
    const need = p.symptoms.length + p.guilt + (p.flags.phobia ? 2 : 0) + (p.flags.debt ? 1 : 0);
    const feeText = p.persona === "hans" ? "free: your father writes the letters" : p.persona === "freud" ? "self-analysis, 750 K in lost hours" : (p.persona === "rat" ? "1,500 K in two instalments" : `1,500 K${fr ? " to Professor Freud" : ""}`);
    const v = await UI.card(this.specFor(p, n, {
      note: "Spin after lying down: 1 to 3, resistance; 4 to 7, one symptom (or two guilt) worked through; 8 to 10, insight, two removed and 1 libido gained.",
      choices: [{ label: "Lie down", sub: feeText, value: true, primary: true, disabled: fee > 0 && p.kronen < (p.persona === "rat" ? 750 : fee) },
        { label: "Walk past", value: false }],
      ai: need >= 1 && (fee === 0 || p.kronen >= fee + 800)
    }));
    if (!v) { UI.log(p, `${p.name} walks past the couch.`); return; }
    if (fee) {
      if (p.persona === "rat") { await this.pay(p, 750, { to: fr }); p.flags.deferredFee += 750; }
      else await this.pay(p, fee, { to: fr });
      if (fr) UI.log(fr, `Professor Freud receives a fee from ${p.name}.`);
    }
    p.couchSessions++;
    const r = await this.spin(p, "couch", "Spin for the session");
    let rem = r <= 3 ? 0 : (r <= 7 ? 1 : 2), lib = r >= 8 ? 1 : 0;
    let outcome = r <= 3 ? "Resistance. The hour passes in silence and small talk." : (r <= 7 ? "Working through. Something gives." : "Insight. The patient sees it, and feels it.");
    const extras = [];
    if (n.last && p.persona === "wolf") { rem = Math.max(rem, 2); lib = 1; extras.push("Freud’s deadline breaks the resistance."); }
    if (p.persona === "anna") { rem++; extras.push("The talking cure sweeps an extra chimney."); }
    if (p.persona === "hans" && p.flags.phobia) {
      p.flags.phobia = false; extras.push("The black around the horses’ mouths, the blinkers: father’s moustache and spectacles. The phobia lifts.");
      this.jot(p, "phobia", "The phobia lifted: the horses’ black muzzles and blinkers read as the father’s moustache and spectacles.");
      this.note(p, "phobia", "cured");
    }
    if (p.persona === "rat" && p.flags.debt && rem > 0) {
      p.flags.debt = false; rem--; extras.push("The debt is settled at last: the post-office clerk had paid all along.");
      this.jot(p, "obsession", "The pince-nez debt settled on the couch: the post-office clerk had paid all along.");
      this.note(p, "debt", "settled");
    }
    const removed = [];
    let guiltOff = 0;
    while (rem > 0 && (p.symptoms.length || p.guilt)) {
      if (p.symptoms.length) { removed.push(p.symptoms.pop()); p.cured++; }
      else { const g = Math.min(2, p.guilt); p.guilt -= g; guiltOff += g; }
      rem--;
    }
    p.libido += lib;
    const chips = removed.map(s => ({ t: `Removed: ${s}`, tone: "good" }));
    if (guiltOff) chips.push({ t: `−${guiltOff} guilt`, tone: "good" });
    if (lib) chips.push({ t: "+1 libido", tone: "good" });
    const parts = removed.map(esc);
    if (guiltOff) parts.push(`${guiltOff} guilt`);
    UI.log(p, `${p.name} on the couch, gondola ${r}: ${parts.length ? "removes " + parts.join(" and ") : "resistance"}.`);
    if (parts.length) p.analysisGains = (p.analysisGains || 0) + 1;
    this.jot(p, "talkingcure", `Session on gondola ${r}: ${r <= 3 ? "resistance" : r <= 7 ? "working through" : "insight"}${parts.length ? `; removed ${parts.map(x => String(x).toLowerCase()).join(" and ")}` : ""}.${parts.length ? " The ego wins ground." : ""}`);
    await this.info(p, { p, kind: "couch", icon: "couch", iconBg: "#6B1D18", iconColor: C.goldHi, kicker: `Session result: ${r}`,
      title: r <= 3 ? "Resistance" : (r <= 7 ? "Working through" : "Insight"), text: [outcome, ...extras].join(" "), chips: chips.length ? chips : [{ t: "Nothing removed", tone: "" }] });
    if (removed.length || lib || guiltOff) Sound.good();
  },

  /* ---------- pass-capable handlers ---------- */
  async payday(p, n, exact) {
    const lines = [];
    const sal = p.career ? p.career.salary : 0;
    if (sal) { this.gain(p, sal); lines.push(`Salary +${fmtK(sal)}`); }
    if (p.character === "retentive") { this.gain(p, 500); lines.push("Savings +500 K"); }
    if (p.object && p.object.type === "anaclitic" && p.anacliticGiven < 5) { p.libido++; p.anacliticGiven++; lines.push("Anaclitic love +1 libido"); }
    if (p.debt > 0) { const i = Math.max(10, Math.round(p.debt * 0.05 / 10) * 10); await this.pay(p, i); lines.push(`Interest −${fmtK(i)}`); }
    if (p.persona === "freud") { await this.pay(p, 250); lines.push("Cigars −250 K"); }
    if (p.persona === "rat" && p.flags.debt) {
      await this.pay(p, 380);
      p.flags.debtPaid = (p.flags.debtPaid || 0) + 1;
      lines.push("Misdirected repayment −380 K");
      if (p.flags.debtPaid >= 3) { p.flags.debt = false; lines.push("So many people repaid that one of them was the right one: the debt is settled"); this.note(p, "debt", "settled"); }
    }
    if (p.flags.deferredFee) { const f = p.flags.deferredFee; p.flags.deferredFee = 0; await this.pay(p, f, { to: this.freudFor(p) }); lines.push(`Second instalment −${fmtK(f)}`); }
    while (p.deferred.length) {
      const d = p.deferred.shift();
      lines.push(`Reality presents the bill for ${esc(d.src)}`);
      await this.applyPenaltyRaw(p, d, d.src);
    }
    while (p.returnQueue > 0) {
      p.returnQueue--;
      const s = this.randomSymptom(p);
      this.addSymptom(p, s, "the return of the repressed");
      lines.push(`The repressed returns as ${esc(s)}`);
    }
    if (p.complex > 0) {
      p.complex++;
      if (p.complex >= 4) {
        p.complex = 0;
        const s = p.persona === "hans" && !p.symptoms.includes("Fear of carts") ? "Fear of carts" : this.randomSymptom(p);
        this.addSymptom(p, s, "the old complex");
        this.note(p, "complexReturn", s);
        lines.push(`The old complex returns as ${esc(s)}`);
      }
    }
    if (p.mourning > 0) { p.mourning--; p.libido++; lines.push("Mourning eases: +1 libido"); }
    if (p.guilt >= 5) {
      p.guilt -= 2;
      const s = this.randomSymptom(p);
      this.addSymptom(p, s, "the need for punishment");
      lines.push(`Guilt demands punishment: 2 guilt become ${esc(s)}`);
    }
    if (exact) {
      const r = this.rng(), t = r < 0.4 ? "positive" : (r < 0.8 ? "negative" : "abstinence");
      p.transference.push(t);
      lines.push(`Draws a transference card: ${TRANSFERENCE[t].name}`);
      this.jot(p, "transference", `Drew ${TRANSFERENCE[t].name.toLowerCase()}.`);
    }
    Sound.coin();
    UI.log(p, `Payday for ${p.name}: ${lines.join("; ")}.`);
    if (exact && p.human) {
      await UI.card({ p, kind: "payday", icon: "coin", iconBg: C.gold, iconColor: C.ink, kicker: n.title === "Pension" ? "Pension" : "Payday", title: "Payday, exactly",
        text: "Landing exactly on payday also brings a transference card. It plays itself when the moment comes.", extra: `<ul class="lines">${lines.map(l => `<li>${l}</li>`).join("")}</ul>` });
    } else UI.toast(p, n.title === "Pension" ? "Pension" : "Payday", lines);
    this.refresh(p);
  },
  async toll(p, n) {

      this.tollOwner = p;

      await this.pay(p, 1000, { to: this.tollOwner });

      UI.toast(p, "Brücke’s Bridge", [`Toll of 1,000 K to ${esc(this.tollOwner.name)}`]);
    }

      choices: [{ label: "Hold on", sub: "a saver: +500 K every payday", value: "retentive", primary: true },

  },
  async sibling(p, n) {
    const pen = this.normPen(p, n.penalty);

  },
  async horseFalls(p, n) {
    const pen = this.normPen(p, n.penalty);
    const extra = p.persona === "hans" ? " This is the very fright your phobia grew from." : "";
    const choice = await UI.card(this.specFor(p, n, { text: n.text + extra, chips: chipsFor({}, pen, p), choices: this.penaltyChoices(p, pen), ai: this.aiDefense(p, pen) }));
    await this.resolvePenalty(p, pen, choice, n.title);
  },
  async fortda(p, n) {
    await this.info(p, this.specFor(p, n));
    const r = await this.spin(p, "fortda", "Throw the reel");
    if (r % 2) { UI.log(p, `Fort! The reel is gone: ${p.name} loses 2 spaces.`); UI.toast(p, "Fort!", ["The reel is gone: back 2"]); await this.moveBack(p, 2); }
    else { UI.log(p, `Da! The reel comes back: ${p.name} moves on 2.`); UI.toast(p, "Da!", ["The reel comes back: forward 2"]); await this.move(p, 2); }
  },
  async dams(p, n) {
    const ok = this.addDefense(p, "reaction");
    this.note(p, "dams", "built");
    this.jot(p, "latency", "Latency: the dams of shame, disgust and morality are built.");
    await this.info(p, this.specFor(p, n, { chips: ok ? [{ t: "+Reaction formation", tone: "good" }] : [] }));
  },
  async repetition(p, n) {
    if (p.flags.repeated) return this.info(p, this.specFor(p, n, { text: "You have repeated this stretch once already. The compulsion rests, for now." }));
    p.flags.repeated = true;
    await this.info(p, this.specFor(p, n, { chips: [{ t: "Back 3 spaces", tone: "bad" }] }));
    await this.moveBack(p, 3);
    this.note(p, "repeat", "repeated");
    this.jot(p, "beyond", "Compelled to repeat a stretch of road.");
  },
  async civilization(p, n) {
    const cost = 2;
    const can = p.libido >= cost;
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "Sublimate", sub: `−${cost} libido, +Kultur tile`, value: "sub", primary: can, disabled: !can },
        { label: "Bear the guilt", sub: "+2 guilt", value: "guilt", primary: !can }],
      ai: can && p.libido >= cost + 1 ? "sub" : (can ? "sub" : "guilt")
    }));
    if (v === "sub") { p.libido -= cost; this.drawKultur(p); this.jot(p, "civilization", "Paid civilization’s price in sublimation."); }
    else { p.guilt += 2; UI.log(p, `${p.name} bears the guilt of civilization.`); this.jot(p, "civilization", "Paid civilization’s price in guilt."); }
  },
  async group(p, n) {
    await this.info(p, this.specFor(p, n, { chips: chipsFor(n.effect, {}, p) }));
    await this.applyEffect(p, n.effect, n.title);
    this.jot(p, "group", "In the crowd: the leader stood in for the ego ideal.");
  },
  async whereid(p, n) {
    const k = Math.min(2, p.guilt);
    await this.info(p, this.specFor(p, n, { chips: k ? [{ t: `−${k} guilt`, tone: "good" }, { t: `+${k} libido`, tone: "good" }] : [{ t: "No guilt to drain", tone: "" }] }));
    p.guilt -= k; p.libido += k;
    p.analysisGains = (p.analysisGains || 0) + 1;
    if (k) UI.log(p, `${p.name} drains ${k} guilt into libido.`);
    this.jot(p, "structure", `Where id was, there ego shall be: ${k ? `drained ${nw(k)} guilt,` : "nothing to drain, but"} the ego wins ground.`);
  },
  async mourning(p, n) {
    const melan = p.guilt >= 4;
    const pen = melan ? { libido: -3, symptom: "Melancholia" } : { libido: -2 };
    const choice = await UI.card(this.specFor(p, n, {
      text: n.text + (melan ? " Your guilt is heavy, and the mourning turns to melancholia." : ""),
      note: melan ? "" : "If you accept the loss, 1 libido returns at each of your next two paydays.",
      chips: chipsFor({}, pen, p), choices: this.penaltyChoices(p, pen), ai: this.aiDefense(p, pen)
    }));
    await this.resolvePenalty(p, pen, choice, n.title);
    if (!melan && choice === "accept") p.mourning = 2;
    UI.log(p, `${p.name} mourns${melan ? ", and falls into melancholia" : ""}.`);
    this.jot(p, "mourning", melan ? "Mourning turned to melancholia: the loss is taken out on the self." : "The work of mourning begins.");
  },
  async uncanny(p, n) {
    const doubles = this.players.filter(q => q !== p && q.pos === p.pos && !q.retired);
    let text = n.text, chips = [];
    if (doubles.length) {
      text += ` You meet ${doubles.map(q => q.name).join(" and ")} here: a double. Everyone on this space loses 1 libido.`;
      [p, ...doubles].forEach(q => q.libido = Math.max(0, q.libido - 1));
      chips.push({ t: "−1 libido each", tone: "bad" });
    } else if (p.house) {
      text += " Your own flat looks suddenly strange to you.";
      p.libido = Math.max(0, p.libido - 1);
      chips.push({ t: "−1 libido", tone: "bad" });
    } else {
      text += " Nothing happens, which is somehow worse.";
    }
    UI.log(p, `${p.name} meets the uncanny.`);
    this.jot(p, "uncanny", doubles.length ? `Met a double: ${doubles.map(q => q.name).join(" and ")}.` : p.house ? "The familiar flat turned strange." : "The uncanny passed by.");
    await this.info(p, this.specFor(p, n, { text, chips }));
  },

  /* ---------- forks & stops ---------- */
  async crossroads(p, n) {
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "Dissolve the complex", sub: "the long road, a milder conscience", value: "dissolve", primary: true },
        { label: "Repress it", sub: "the short road, it will return", value: "repress" }],
      ai: this.rng() < 0.65 ? "dissolve" : "repress"
    }));
    p.route[n.id] = this.G[n.id].branches[v];
    this.note(p, "oedipus", v);
    UI.log(p, `At the crossroads ${p.name} chooses to ${v === "dissolve" ? "dissolve the complex" : "repress it"}.`);
    this.jot(p, "oedipus", v === "dissolve" ? "At the crossroads the complex is to be dissolved; identification with the parents should follow." : "At the crossroads the complex is repressed rather than dissolved.");
  },
  async matura(p, n) {
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "University of Vienna", sub: "5,000 K tuition loan, higher salaries", value: "uni", primary: true },
        { label: "Straight into life", sub: "shorter road, a trade", value: "work" }],
      ai: p.persona === "freud" || p.persona === "rat" ? "uni" : (this.rng() < 0.5 ? "uni" : "work")
    }));
    p.route[n.id] = this.G[n.id].branches[v];
    if (v === "uni") { p.debt += 5000; UI.log(p, `${p.name} enrols at the University, on a 5,000 K note.`); }
    else UI.log(p, `${p.name} goes straight into working life.`);
    this.note(p, "matura", v);
    this.jot(p, "lovework", v === "uni" ? "Passed the Matura and enrolled at the University." : "Left school for working life.");
  },
  async career(p, n, deckName) {
    p.done[n.id] = true;
    const deck = this.decks[deckName];
    const a = deck.draw(), b = deck.draw(c => c.name !== a.name);
    const v = await UI.card(this.specFor(p, n, {
      extra: `<ul class="offer">${[a, b].map(c => `<li><b>${c.name}</b> <em>${c.de}</em>, ${fmtK(c.salary)} each payday. ${esc(c.note || "")}</li>`).join("")}</ul>`,
      choices: [{ label: a.name, sub: fmtK(a.salary), value: 0, primary: true }, { label: b.name, sub: fmtK(b.salary), value: 1 }],
      ai: (a.salary + (a.effect && a.effect.kultur ? 2500 : 0) - (a.effect && a.effect.libido ? 1500 : 0)) >= (b.salary + (b.effect && b.effect.kultur ? 2500 : 0) - (b.effect && b.effect.libido ? 1500 : 0)) ? 0 : 1
    }));
    const c = v === 0 ? a : b;
    deck.putBack(v === 0 ? b : a);
    p.career = { name: c.name, salary: c.salary };
    if (c.effect) await this.applyEffect(p, c.effect, c.name);
    UI.log(p, `${p.name} becomes ${aOrAn(c.name)} at ${fmtK(c.salary)} a payday.`);
    this.note(p, "career", c.name);
    this.jot(p, "lovework", `Work: became ${aOrAn(c.name)}.`);
    Sound.good();
  },
  async careerAcad(p, n) { return this.career(p, n, "academic"); },
  async careerTrade(p, n) { return this.career(p, n, "trade"); },
  async object(p, n) {
    if (p.object || p.flags.sublimatedLove) {
      UI.log(p, "No bigamy: Milton Bradley forbade it.");
      return this.info(p, this.specFor(p, n, { text: "You have chosen already. Milton Bradley’s rules had a law against bigamy, and so does Vienna." }));
    }
    p.done[n.id] = true;
    const rr = this.rng();
    const v = await UI.card(this.specFor(p, n, {
      extra: `<ul class="offer">
        <li><b>Anaclitic</b>, someone like those who fed and protected you: +1 libido now and at each of your next five paydays.</li>
        <li><b>Narcissistic</b>, someone like yourself, or who you once were, or would like to be: +4 libido now.</li>
        <li><b>Sublimate</b>: no partner; take a Kultur tile. No presents and no honeymoon.</li></ul>`,
      choices: [{ label: "Anaclitic", value: "anaclitic", primary: true }, { label: "Narcissistic", value: "narcissistic" }, { label: "Sublimate", value: "sublimate" }],
      ai: rr < 0.45 ? "anaclitic" : (rr < 0.82 ? "narcissistic" : "sublimate")
    }));
    if (v === "sublimate") {
      p.flags.sublimatedLove = true; this.drawKultur(p);
      UI.log(p, `${p.name} chooses no partner and pours the libido into work.`);
      this.jot(p, "drive", "Chose no partner; the libido goes into work.");
      this.note(p, "love", "sublimated");
      return;
    }
    p.object = { type: v };
    p.libido += v === "anaclitic" ? 1 : 4;
    Board.placeTokens(this.players);
    this.note(p, "love", v);
    UI.log(p, `${p.name} makes an ${v} object choice.`);
    this.jot(p, "narcissism", v === "anaclitic" ? "An anaclitic object choice, after the model of those who fed and protected." : "A narcissistic object choice, after the model of the self.");
    Sound.good();
    const r = await this.spin(p, "presents", "Spin for wedding presents");
    const each = r <= 3 ? 1000 : (r <= 6 ? 500 : 0);
    if (each) { for (const q of this.rivals(p, true)) await this.pay(q, each, { to: p }); }
    UI.log(p, each ? `Wedding presents: ${fmtK(each)} from each rival.` : "No wedding presents this time.");
    UI.toast(p, "Wedding presents", [each ? `${fmtK(each)} from each rival` : "The guests forgot"]);
    this.refresh(p);
    await this.wait(400);
    const h = await this.spin(p, "honeymoon", "Spin for the honeymoon");
    UI.log(p, `Honeymoon: ${p.name} drives on ${h}.`);
    UI.toast(p, "Honeymoon", [`Milton Bradley’s rule: spin again and drive on ${h}`]);
    await this.move(p, h);
  },
  async war(p, n) {
    p.done[n.id] = true;
    await this.info(p, this.specFor(p, n, { note: "Spin: 1 to 3, war neurosis; 4 to 7, 3,000 K lost; 8 to 10, spared." }));
    if (p.persona === "wolf" && p.kronen > 0) {
      const before = p.kronen;
      p.kronen = Math.round(p.kronen * 0.15 / 10) * 10;
      UI.log(p, `The Revolution takes the Wolf Man’s fortune: ${fmtK(before)} becomes ${fmtK(p.kronen)}.`);
      UI.toast(p, "1917", [`The family fortune: ${fmtK(before)} to ${fmtK(p.kronen)}`], "bad");
      this.note(p, "war", "fortune lost");
      Sound.bad();
    }
    const r = await this.spin(p, "war", "Spin for the war");
    let pen = {}, title, text;
    if (r <= 3) { pen = { symptom: "War neurosis", libido: -1 }; title = "War neurosis"; text = "You come home dreaming the same horror every night. Freud’s war dreams were exactly these."; }
    else if (r <= 7) { pen = { kronen: -3000 }; title = "War bonds"; text = "Your savings go into war bonds, which will soon be worth nothing."; }
    else { title = "Spared"; text = "You come through untouched, and ashamed of your relief."; }
    const choice = await UI.card({ p, kind: "stop", icon: "helmet", iconBg: C.black, iconColor: C.goldHi, kicker: `The war: ${r}`, title, text,
      src: "Beyond the Pleasure Principle (1920)", chips: this.penCost(pen) ? chipsFor({}, pen, p) : [{ t: "+1 libido", tone: "good" }],
      choices: this.penaltyChoices(p, pen), ai: this.aiDefense(p, pen) });
    if (this.penCost(pen)) await this.resolvePenalty(p, pen, choice, "the war");
    else p.libido += 1;
    if (!p.story.some(e => e.k === "war")) this.note(p, "war", title);
    UI.log(p, `The war: ${p.name}, ${title.toLowerCase()}.`);
    this.jot(p, "beyond", `The war, gondola ${r}: ${title.toLowerCase()}.`);
  },
  async berggasse(p, n) {
    const need = p.symptoms.length + p.guilt + (p.flags.phobia ? 2 : 0);
    const v = await UI.card(this.specFor(p, n, {
      choices: [{ label: "Berggasse 19", sub: "the analysis lane, three couches", value: "berggasse", primary: true },
        { label: "The Ringstraße", sub: "shorter, carry on as you are", value: "ring" }],
      ai: need >= 2 && (p.persona === "hans" || p.persona === "freud" || p.kronen >= 3000) ? "berggasse" : "ring"
    }));
    p.route[n.id] = this.G[n.id].branches[v];
    this.note(p, "berggasse", v);
    this.jot(p, "talkingcure", v === "berggasse" ? "Turned into the Berggasse for an analysis." : "Took the Ring and declined analysis.");
    UI.log(p, `${p.name} takes ${v === "berggasse" ? "the Berggasse" : "the Ring"}.`);
  },
  async reckoning(p, n) {
    p.done[n.id] = true;
    const lines = [];
    const kids = p.children.length;
    if (kids) { this.gain(p, kids * 5000); lines.push(`Children: +${fmtK(kids * 5000)}`); }
    if (p.debt) { const due = Math.round(p.debt * 1.25); lines.push(`Debts repaid at 125 percent: −${fmtK(due)}`); p.kronen -= due; p.debt = 0; }
    const ranks = this.players.slice().sort((a, b) => this.estimate(b) - this.estimate(a));
    const last = ranks[ranks.length - 1] === p && this.players.length > 1;
    const behind = ranks[0] !== p ? this.estimate(ranks[0]) - this.estimate(p) : 0;
    const aiWager = (last && behind > 30000 && p.kronen < 12000) || (p.kronen <= 1000 && behind > 15000);
    const v = await UI.card(this.specFor(p, n, {
      extra: lines.length ? `<ul class="lines">${lines.map(l => `<li>${l}</li>`).join("")}</ul>` : "",
      note: "Retire safely, or put all your cash on one gondola: if the wheel stops there, 75,000 K and immortality; if not, your cash is gone and the analysis never ends.",
      choices: [{ label: "Retire to common unhappiness", value: "retire", primary: true }, { label: "Stake everything on immortality", value: "wager" }],
      ai: aiWager ? "wager" : "retire"
    }));
    if (v === "retire") {
      await this.teleport(p, "endCommon");
      p.retired = true; p.endLabel = "Common unhappiness";
      UI.log(p, `${p.name} retires to common unhappiness.`);
      if (!this.firstRetiree) {
        this.firstRetiree = p;
        this.gain(p, 10000);
        const lucky = await UI.pickNumber(p, "Choose a lucky gondola", "First to retire: +10,000 K. Whenever a rival spins this number to move, they pay you 1,000 K.", [], 1 + Math.floor(this.rng() * 10));
        p.lucky = lucky;
        UI.log(p, `${p.name} is first to retire: +${fmtK(10000)}, lucky gondola ${lucky}.`);
      }
      this.note(p, "end", "common");
    } else {
      const num = await UI.pickNumber(p, "Stake it on which gondola?", "One chance in ten.", [], 1 + Math.floor(this.rng() * 10));
      const r = await this.spin(p, "wager", `Spin for gondola ${num}`);
      if (r === num) {
        this.gain(p, 75000);
        await this.teleport(p, "endImmortal");
        p.endLabel = "Immortality";
        UI.log(p, `Gondola ${r}! ${p.name} wins the wager: +${fmtK(75000)} and immortality.`);
        UI.toast(p, "Immortality", ["+75,000 K"], "good");
        Sound.good();
        this.note(p, "end", "immortal");
      } else {
        const lost = Math.max(0, p.kronen);
        p.kronen = Math.min(0, p.kronen);
        await this.teleport(p, "endInterminable");
        p.endLabel = "Interminable analysis";
        UI.log(p, `Gondola ${r}, not ${num}. ${p.name} loses ${fmtK(lost)} and enters interminable analysis.`);
        UI.toast(p, "Interminable analysis", [`Gondola ${r}, not ${num}`, `−${fmtK(lost)}`], "bad");
        Sound.bad();
        this.note(p, "end", "interminable");
      }
      p.retired = true;
    }
    this.jot(p, "terminable", `Case closed: ${p.endLabel.toLowerCase()}.`);
    Board.placeTokens(this.players);
    this.refresh(p);
  },

  /* ---------- scoring & histories ---------- */
  score(p) {
    const cash = p.kronen - Math.round(p.debt * 1.25);
    const kv = p.kultur.reduce((a, k) => a + k.value, 0);
    const house = p.house ? 16000 : 0, cath = p.cathexis.length * 3000, car = p.career ? 5000 : 0, wolf = p.flags.wolfDream ? 10000 : 0;
    const kids = p.children.length * 2000, lib = p.libido * 1000, obj = p.object ? 5000 : 0;
    const sym = p.symptoms.length * 4000, gu = p.guilt * 1500;
    const love = kids + lib + obj, work = cash + house + cath + kv + car + wolf, neurosis = -(sym + gu);
    const lines = [`cash ${fmtK(cash)}`];
    if (house) lines.push(`flat ${fmtK(house)}`);
    if (cath) lines.push(`cathexes ${fmtK(cath)}`);
    if (p.kultur.length) lines.push(`Kultur: ${p.kultur.map(k => `${k.name.replace(/^A /, "a ").replace(/^An /, "an ")} ${fmtK(k.value)}`).join(", ")}`);
    if (car) lines.push(`career ${fmtK(car)}`);
    if (wolf) lines.push(`the wolf dream ${fmtK(wolf)}`);
    if (obj) lines.push(`love object ${fmtK(obj)}`);
    if (kids) lines.push(`children ${fmtK(kids)}`);
    lines.push(`libido ${fmtK(lib)}`);
    if (sym) lines.push(`symptoms −${fmtK(sym)}`);
    if (gu) lines.push(`guilt −${fmtK(gu)}`);
    return { p, love, work, neurosis, total: love + work + neurosis, lines };
  },
  history(p, rank) {
    const s = [], has = k => p.story.find(e => e.k === k);
    const W = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
    const word = n => W[n] || String(n), cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
    const kname = k => k.name.replace(/^A /, "a ").replace(/^An /, "an ");
    s.push(`${p.name} set out from birth in a Fiaker behind two white horses${p.persona === "hans" ? ", which took some courage" : ""}.`);
    if (p.character) s.push(p.character === "retentive" ? "In the nursery the patient learned to hold on, and became a saver." : "In the nursery the patient learned to let go, and stayed generous.");
    const fx = p.story.filter(e => e.k === "fix").length;
    if (fx) s.push(`${cap1(word(fx))} ${fx === 1 ? "detachment" : "detachments"} of libido stayed behind at fixation points.`);
    const oe = has("oedipus");
    if (oe) s.push(oe.t === "dissolve" ? `At the place where three roads meet the complex was dissolved, and a super-ego of severity ${p.severity} took its place.`
      : `At the crossroads the complex was merely repressed, leaving a super-ego of severity ${p.severity}${has("complexReturn") ? `; it returned later as ${has("complexReturn").t.toLowerCase()}` : ""}.`);
    const ma = has("matura");
    if (ma) s.push(`${ma.t === "uni" ? "The patient went on to the University" : "The patient went straight into working life"}${p.career ? ` and became ${aOrAn(p.career.name)}` : ""}.`);
    const lv = has("love");
    if (lv) s.push(lv.t === "sublimated" ? `Love was sublimated into work${p.children.length ? `, though ${word(p.children.length)} ${p.children.length === 1 ? "child" : "children"} still rode in the carriage` : ""}.` : `The object choice was ${lv.t}${p.children.length ? `, and ${word(p.children.length)} ${p.children.length === 1 ? "child" : "children"} rode in the carriage` : ""}.`);
    const w = has("war");
    if (w) s.push(w.t === "fortune lost" ? "The Revolution took the family fortune." : `The war left the patient ${w.t === "Spared" ? "spared" : w.t === "War bonds" ? "poorer" : "with a war neurosis"}.`);
    if (has("phobia")) s.push("The horse phobia lifted on the couch.");
    if (has("debt")) s.push("The pince-nez debt was finally settled.");
    if (has("door")) s.push("Once, the patient simply walked out.");
    if (!p.couchSessions) s.push("The patient never lay on the couch.");
    else if (!p.cured) s.push(`${cap1(word(p.couchSessions))} ${p.couchSessions === 1 ? "session" : "sessions"} on the couch met only resistance.`);
    else s.push(`${cap1(word(p.couchSessions))} ${p.couchSessions === 1 ? "session" : "sessions"} on the couch removed ${word(p.cured)} ${p.cured === 1 ? "symptom" : "symptoms"}.`);
    if (p.kultur.length) s.push(`Sublimations: ${p.kultur.map(kname).join(", ")}.`);
    const endPhrase = p.endLabel === "Immortality" ? "The patient staked everything at the end and won immortality"
      : p.endLabel === "Interminable analysis" ? "The patient staked everything at the end and went into interminable analysis"
      : "The patient retired to common unhappiness";
    s.push(`${endPhrase}${p.symptoms.length ? `, still carrying ${p.symptoms.map(x => x.replace(/^A /, "a ").toLowerCase()).join(", ")}` : ", free of symptoms"}.`);
    let verdict = "Prognosis: common unhappiness, which is to say, a life.";
    if (p.endLabel === "Immortality") verdict = "Prognosis: immortal, which Freud himself never quite managed to believe of anyone.";
    else if (p.symptoms.length >= 3) verdict = "Prognosis: interminable.";
    else if (p.guilt >= 7) verdict = "The super-ego was never satisfied.";
    else if (rank === 0) verdict = "Prognosis: favourable, by Viennese standards.";
    s.push(verdict);
    return s.map(esc).join(" ");
  },
  async finish(cfg) {
    const res = this.players.map(p => this.score(p)).sort((a, b) => b.total - a.total);
    res.forEach((r, i) => {
      const per = PERSONAS.find(x => x.key === r.p.persona);
      r.history = this.history(r.p, i);
      r.epilogue = per.epilogue;
    });
    UI.log(null, `The game is over. ${res[0].p.name} wins with ${fmtK(res[0].total)}.`);
    window.__lastResults = res.map(r => ({ name: r.p.name, total: r.total, love: r.love, work: r.work, neurosis: r.neurosis, end: r.p.endLabel, rounds: this.round,
      turns: r.p.turns, surges: r.p.surges, brakes: r.p.brakes, adjusts: r.p.adjusts, notes: r.p.notes.length, gains: r.p.analysisGains, sym: r.p.symptoms.length, guilt: r.p.guilt, kultur: r.p.kultur.length, kids: r.p.children.length, couch: r.p.couchSessions, libido: r.p.libido,
      route: Object.values(r.p.route).join("/"), career: r.p.career && r.p.career.name, debt: r.p.debt, kronen: r.p.kronen }));
    if (cfg && cfg.autotest) return "done";
    return UI.final(res);
  }
};

/* =====================================================================
   MAIN
   ===================================================================== */
function confirmNewGame() {
  const ov = document.getElementById("overlay2");
  ov.innerHTML = `<div class="card small" role="dialog" aria-modal="true" aria-labelledby="cfT"><div class="card-in">
    <h2 id="cfT">Start a new game?</h2><p class="card-text">The game in progress will be lost.</p>
    <div class="card-actions"><button class="btn primary" id="cfYes">Start over</button><button class="btn" id="cfNo">Keep playing</button></div></div></div>`;
  ov.hidden = false;
  document.getElementById("cfYes").addEventListener("click", () => { location.href = location.pathname; });
  document.getElementById("cfNo").addEventListener("click", () => { ov.hidden = true; ov.innerHTML = ""; });
  setTimeout(() => document.getElementById("cfNo").focus(), 30);
}

async function runAutotest(params) {
  const games = +(params.get("games") || 6), seed0 = +(params.get("seed") || 1);
  const keys = PERSONAS.map(p => p.key), out = [];
  for (let i = 0; i < games; i++) {
    await new Promise(r => setTimeout(r, 0));
    const rot = keys.slice(i % keys.length).concat(keys.slice(0, i % keys.length));
    const personas = rot.slice(0, 2 + (i % 3));
    try {
      await Game.start({ seed: seed0 + i, speed: "instant", allAI: true, autotest: true, personas });
      out.push({ ok: true, res: window.__lastResults });
    } catch (e) {
      out.push({ ok: false, error: String(e && e.stack || e) });
    }
  }
  window.__autotest = out;
  document.title = "AUTOTEST DONE";
}

window.addEventListener("DOMContentLoaded", async () => {
  UI.init();
  Tip.init();
  Board.init(document.getElementById("board"));
  Wheel.init(document.getElementById("wheel"));
  const spinBtn = document.getElementById("spinBtn");
  spinBtn.addEventListener("click", () => { Sound.ensure(); if (Game.spinResolver) Game.spinResolver(); });
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" && e.key !== " ") return;
    if (!Game.spinResolver || UI.cardOpen || !document.getElementById("overlay2").hidden) return;
    const t = e.target;
    if (t && (t.tagName === "BUTTON" || t.tagName === "INPUT" || t.tagName === "SUMMARY")) return;
    e.preventDefault(); spinBtn.click();
  });
  document.getElementById("btnNew").addEventListener("click", confirmNewGame);

  const params = new URLSearchParams(location.search);
  if (params.has("autotest")) { UI.speed = "instant"; await runAutotest(params); return; }
  if (params.has("peek") || params.has("final")) {
    const seed = +(params.get("seed") || 3);
    Game.peekRound = params.has("peek") ? +params.get("peek") : 0;
    await Game.start({ seed, speed: "instant", allAI: true, autotest: !params.has("final"), personas: ["hans", "dora", "wolf", "freud"] });
    UI.speed = "normal";
    Board.placeTokens(Game.players);
    const cur = Game.players[Game.turn] || Game.players[0];
    UI.setTurn(cur, Game.stage(cur)); UI.renderLedger(cur); UI.renderStrip(Game.players, cur);
    Wheel.setAgencies(Game.psycheRule ? Psyche.compute(cur).map : null); UI.renderWheelKey(Game.psycheRule ? cur : null);
    document.title = "PEEK READY";
    return;
  }
  for (;;) {
    const cfg = await UI.setup();
    if (params.has("seed")) cfg.seed = +params.get("seed");
    await Game.start(cfg);
  }
});

</script>
