<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Clock</title>
  <style>
    :root {
      --bg1: #101828;
      --bg2: #1d2939;
      --face: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.45);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --second: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #334155, transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .clock-card {
      width: min(92vw, 430px);
      padding: 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-align: center;
    }

    .clock {
      position: relative;
      width: min(72vw, 310px);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,0.16) 0 4px, transparent 5px),
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 65%);
      border: 8px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        inset 0 0 35px rgba(255, 255, 255, 0.08),
        0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 11px;
      background: var(--line);
      transform-origin: 50% calc(-1 * (min(72vw, 310px) / 2 - 22px));
    }

    .tick.big {
      width: 4px;
      height: 18px;
      background: rgba(255, 255, 255, 0.78);
      border-radius: 99px;
    }

    .number {
      position: absolute;
      left: 50%;
      top: 50%;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--muted);
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 99px;
    }

    .hour {
      width: 8px;
      height: 27%;
      background: var(--text);
    }

    .minute {
      width: 5px;
      height: 37%;
      background: var(--accent);
    }

    .second {
      width: 2px;
      height: 42%;
      background: var(--second);
    }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      background: var(--text);
      border: 4px solid var(--second);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(251, 113, 133, 0.55);
    }

    .digital {
      font-size: clamp(2.3rem, 8vw, 3.7rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .date {
      margin-top: 10px;
      color: var(--muted);
      font-size: 1rem;
    }

    .timezone {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="clock-card">
    <div class="clock" id="clock">
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
      <div class="pin"></div>
    </div>

    <div class="digital" id="digitalTime">--:--:--</div>
    <div class="date" id="dateText">Loading date...</div>
    <div class="timezone" id="timezoneText"></div>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const secondHand = document.getElementById("secondHand");
    const digitalTime = document.getElementById("digitalTime");
    const dateText = document.getElementById("dateText");
    const timezoneText = document.getElementById("timezoneText");

    function buildClockFace() {
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement("div");
        tick.className = "tick" + (i % 5 === 0 ? " big" : "");
        tick.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg) translateY(-132px)`;
        clock.appendChild(tick);
      }

      for (let n = 1; n <= 12; n++) {
        const number = document.createElement("div");
        number.className = "number";
        number.textContent = n;
        const angle = (n * 30 - 90) * Math.PI / 180;
        const radius = 105;
        number.style.transform =
          `translate(calc(-50% + ${Math.cos(angle) * radius}px), calc(-50% + ${Math.sin(angle) * radius}px))`;
        clock.appendChild(number);
      }
    }

    function updateClock() {
      const now = new Date();

      const ms = now.getMilliseconds();
      const seconds = now.getSeconds() + ms / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      secondHand.style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hours * 30}deg)`;

      digitalTime.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      dateText.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      timezoneText.textContent =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "Local time";
    }

    buildClockFace();
    updateClock();
    setInterval(updateClock, 50);
  </script>
</body>
</html>
